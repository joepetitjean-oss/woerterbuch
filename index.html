<!DOCTYPE html>
<html lang="de">
<head>
  <!-- Grundeinstellungen: Zeichensatz und Anpassung an Handy-Bildschirme -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Diese Zeilen erlauben "Zum Home-Bildschirm hinzufügen" wie eine App -->
  <meta name="theme-color" content="#2b5797">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Wörterbuch">
  <title>Wörterbuch</title>

  <!-- ===================== Aussehen (CSS) ===================== -->
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
      background: #f2f4f8;
      color: #222;
      font-size: 18px;            /* große Schrift für das Handy */
    }
    header {
      background: #2b5797;
      color: white;
      padding: 16px;
      text-align: center;
    }
    header h1 { margin: 0; font-size: 1.5em; }
    main { padding: 16px; max-width: 600px; margin: 0 auto; }

    label { display: block; font-weight: bold; margin: 12px 0 6px; }
    /* Große Felder und Knopf: gut mit dem Finger zu treffen */
    select, input, button {
      width: 100%;
      font-size: 1.1em;           /* ab 16px zoomt iPhone nicht automatisch */
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #b8c0cc;
      background: white;
    }
    button {
      margin-top: 16px;
      background: #2b5797;
      color: white;
      border: none;
      font-weight: bold;
    }
    button:disabled { background: #8a9bb8; }

    /* Wortfeld und Mikrofon-Knopf nebeneinander */
    .wortzeile { display: flex; gap: 8px; }
    .wortzeile input { flex: 1; }
    #mikro {
      width: 60px;                /* groß genug für den Daumen */
      margin-top: 0;
      font-size: 1.4em;
      padding: 0;
    }
    #mikro.hoert { background: #d32f2f; }   /* rot = hört gerade zu */

    #ergebnis {
      margin-top: 20px;
      background: white;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    #ergebnis:empty { display: none; }   /* leer = unsichtbar */
    #ergebnis h2 { margin-top: 0; }
    .bedeutung { margin: 8px 0; }
    .wortart { color: #666; font-size: 0.85em; }
    .beispiel {
      margin-top: 14px;
      padding: 10px;
      background: #eef3fb;
      border-left: 4px solid #2b5797;
      border-radius: 6px;
    }
    .uebersetzung { color: #555; font-style: italic; margin-top: 4px; }
    .fehler { color: #b00020; }
    /* Abschnitt "Auf Deutsch" (gelblicher Kasten) */
    .deutsch {
      margin-top: 16px;
      padding: 10px;
      background: #fdf6e3;
      border-left: 4px solid #e0a800;
      border-radius: 6px;
    }
    .deutsch h3, .beispiel h3 { margin: 0 0 6px; font-size: 1em; }
    #ergebnis h2 { margin-bottom: 2px; }
    /* Klappbereich "Englische Erklärung anzeigen" */
    details { margin-top: 14px; font-size: 0.9em; color: #444; }
    summary { cursor: pointer; color: #2b5797; padding: 8px 0; }
    .hinweis { color: #777; font-size: 0.8em; margin-top: 14px; }
    /* Knöpfe für die Einzelwörter einer Wortgruppe */
    .einzelwoerter { margin-top: 14px; color: #555; }
    .einzelwort { font-size: 1em; margin: 4px 6px 0 0; padding: 8px 14px; border-radius: 18px;
                  border: 1px solid #bbb; background: #f4f4f4; color: #222; }
  </style>
</head>
<body>
  <header><h1>📖 Wörterbuch</h1></header>

  <main>
    <!-- Das Formular: Sprache wählen, Wort eingeben, Knopf drücken -->
    <form id="formular">
      <label for="sprache">Sprache</label>
      <select id="sprache">
        <option value="de">Deutsch</option>
        <option value="en">Englisch</option>
        <option value="es">Spanisch</option>
        <option value="fr">Französisch</option>
      </select>

      <label for="wort">Wort</label>
      <div class="wortzeile">
        <!-- autocorrect="off": iPhone soll das Wort nicht "verbessern" -->
        <input id="wort" type="text" placeholder="z. B. Haus"
               autocomplete="off" autocapitalize="none" autocorrect="off"
               spellcheck="false" enterkeyhint="search">
        <!-- Mikrofon-Knopf für die Spracheingabe -->
        <button id="mikro" type="button" aria-label="Wort sprechen" title="Wort sprechen">🎤</button>
      </div>
      <p id="mikroHinweis" class="hinweis" hidden></p>

      <button id="knopf" type="submit">Nachschlagen</button>
    </form>

    <!-- Hier erscheint das Ergebnis -->
    <div id="ergebnis" aria-live="polite"></div>
  </main>

  <!-- ===================== Programm (JavaScript) ===================== -->
  <script>
    // ---------------------------------------------------------------
    // Schritt 1: Einstellungen festlegen
    // ---------------------------------------------------------------
    const SPRACHEN = { de: "Deutsch", en: "Englisch", es: "Spanisch", fr: "Französisch" };
    const API_ADRESSE = "https://en.wiktionary.org/api/rest_v1/page/definition/";
    // Such-Schnittstelle: hilft, wenn der Akzent fehlt (z. B. "cabron" -> "cabrón").
    // origin=* ist nötig, damit der Browser die Antwort lesen darf.
    const SUCH_ADRESSE = "https://en.wiktionary.org/w/api.php?action=query&list=search" +
                         "&srprop=&srlimit=20&format=json&origin=*&srsearch=";
    // Deutsches Wiktionary: hier stehen die deutschen Übersetzungen/Bedeutungen
    const DE_ADRESSE = "https://de.wiktionary.org/w/api.php?action=query&prop=revisions" +
                       "&rvprop=content&rvslots=main&redirects=1&format=json&formatversion=2" +
                       "&origin=*&titles=";
    // Englisches Wiktionary: ganze Seiten (für die Übersetzungstabellen)
    const EN_SEITEN_ADRESSE = "https://en.wiktionary.org/w/api.php?action=query&prop=revisions" +
                              "&rvprop=content&rvslots=main&redirects=1&format=json&formatversion=2" +
                              "&origin=*&titles=";
    // Notlösung, wenn das deutsche Wiktionary nichts hat: maschinelle Übersetzung
    const MT_ADRESSE = "https://api.mymemory.translated.net/get?langpair=";
    // Sprache für die Spracherkennung (passend zur gewählten Sprache)
    const ERKENNUNGS_SPRACHE = { de: "de-DE", en: "en-US", es: "es-ES", fr: "fr-FR" };
    // Wikimedia möchte wissen, wer anfragt. Im Browser geht das mit "Api-User-Agent".
    const API_USER_AGENT = "WoerterbuchLernprojekt/1.0 (Web-App, Uebungsprojekt)";
    const MAX_BEDEUTUNGEN = 3;

    // Eigene Fehlerarten, damit wir passende Meldungen zeigen können
    class WortNichtGefunden extends Error {}
    class KeinInternet extends Error {}

    // Elemente der Seite holen, damit wir sie später ändern können
    const formular = document.getElementById("formular");
    const spracheFeld = document.getElementById("sprache");
    const wortFeld = document.getElementById("wort");
    const knopf = document.getElementById("knopf");
    const ergebnis = document.getElementById("ergebnis");
    const mikroKnopf = document.getElementById("mikro");
    const mikroHinweis = document.getElementById("mikroHinweis");

    // ---------------------------------------------------------------
    // Eingabe säubern (wichtig fürs Handy!)
    // - normalize("NFC"): "o" + Akzent-Zeichen wird zu einem Zeichen "ó"
    // - unsichtbare Zeichen (z. B. Null-Breite-Leerzeichen) entfernen
    // - schräge Apostrophe ’ (iPhone) durch normale ' ersetzen
    // - Satzzeichen und Leerzeichen am Anfang und Ende entfernen
    // ---------------------------------------------------------------
    function wortSaeubern(text) {
      return text
        .normalize("NFC")
        .replace(/\p{Cf}/gu, "")                 // unsichtbare Steuerzeichen
        .replace(/[\u2018\u2019\u02BC]/g, "'")    // ’ ‘ ʼ  ->  '
        .replace(/^[\s\p{P}]+|[\s\p{P}]+$/gu, "") // Satzzeichen am Rand
        .replace(/\s+/g, " ");                    // mehrere Leerzeichen -> eins
    }

    // Akzente entfernen und klein schreiben: "Cabrón" -> "cabron"
    function ohneAkzente(text) {
      return text.normalize("NFD").replace(/\p{M}/gu, "").toLowerCase();
    }

    // ---------------------------------------------------------------
    // Schritt 2: HTML entfernen
    // Die Antwort enthält HTML (Links, fett usw.). Wir wollen nur Text.
    // DOMParser liest das HTML, ohne es auszuführen – das ist sicher.
    // ---------------------------------------------------------------
    function htmlEntfernen(text) {
      if (!text) return "";
      const dokument = new DOMParser().parseFromString(text, "text/html");
      dokument.querySelectorAll("style, script").forEach(e => e.remove()); // CSS-Code weg
      return dokument.body.textContent.replace(/\s+/g, " ").trim();
    }

    // ---------------------------------------------------------------
    // Schritt 3: Anfrage ins Internet schicken
    // ---------------------------------------------------------------
    async function datenHolen(wort) {
      // encodeURIComponent macht das Wort "adress-tauglich" (ä -> %C3%A4)
      const adresse = API_ADRESSE + encodeURIComponent(wort);
      let antwort;
      try {
        antwort = await fetch(adresse, { headers: { "Api-User-Agent": API_USER_AGENT } });
      } catch (e) {
        // fetch scheitert ganz, wenn keine Verbindung besteht
        throw new KeinInternet();
      }
      if (antwort.status === 404) throw new WortNichtGefunden();
      if (!antwort.ok) throw new KeinInternet("Server-Fehler " + antwort.status);
      return await antwort.json();   // Schritt 4: JSON lesen
    }

    // ---------------------------------------------------------------
    // Artikel am Anfang entfernen ("la maison" -> "maison")
    // Leute tippen oft den Artikel mit. Wiktionary kennt aber nur "maison".
    // Längere Artikel zuerst, damit "de la" vor "de" geprüft wird.
    // ---------------------------------------------------------------
    const ARTIKEL = {
      fr: ["de la", "de l'", "les", "le", "la", "l'", "une", "un", "des", "du"],
      es: ["los", "las", "el", "la", "unos", "unas", "una", "un"],
      de: ["der", "die", "das", "den", "dem", "des", "einen", "einem", "einer", "eine", "ein"],
      en: ["the", "an", "a", "to"],   // "to" für Verben: "to eat" -> "eat"
    };

    function artikelEntfernen(text, sprache) {
      const klein = text.toLowerCase();
      for (const artikel of ARTIKEL[sprache]) {
        // "l'" hängt direkt am Wort ("l'eau"), die anderen haben ein Leerzeichen danach
        const mitAbstand = artikel.endsWith("'") ? artikel : artikel + " ";
        if (klein.startsWith(mitAbstand) && text.length > mitAbstand.length) {
          return text.slice(mitAbstand.length).trim();
        }
      }
      return text;   // kein Artikel gefunden (oder nur der Artikel allein eingegeben)
    }

    // ---------------------------------------------------------------
    // "Form von": Wiktionary sagt bei "maisons" nur "plural of maison".
    // Dann holen wir lieber den Grundeintrag ("maison").
    // ---------------------------------------------------------------

    // Veraltete oder seltene Bedeutungen ("(obsolete) a path" bei "went") zählen nicht
    const SELTEN = /^\s*\([^)]*\b(obsolete|archaic|rare|dated|dialectal|nonstandard|nonce)\b/i;

    // Die "eigenen" Bedeutungen eines Eintrags: keine "Form von", nichts Veraltetes
    function eigeneBedeutungen(eintrag) {
      if (eintrag.partOfSpeech === "Symbol") return [];         // Sprachcodes zählen nicht
      // Ist die ERSTE Bedeutung "Mehrzahl von ..." ("manzanas" = Äpfel; danach erst "Tollpatsch"),
      // dann ist der Eintrag hauptsächlich eine Form.
      const erste = (eintrag.definitions || []).find(d => htmlEntfernen(d.definition || ""));
      if (erste && erste.definition.includes("form-of-definition") &&
          /plural/i.test(htmlEntfernen(erste.definition))) return [];
      return (eintrag.definitions || []).filter(d => {
        const html = d.definition || "";
        const text = htmlEntfernen(html);
        return text && !html.includes("form-of-definition") && !SELTEN.test(text);
      });
    }

    // Sucht die erste "Form von ..."-Bedeutung und liest den Link zur Grundform.
    // Gibt { grundform, beschreibung, art } zurück (oder null).
    function formVerweis(eintraege) {
      for (const eintrag of eintraege) {
        if (eintrag.partOfSpeech === "Symbol") continue;
        for (const definition of (eintrag.definitions || [])) {
          const html = definition.definition || "";
          if (!html.includes("form-of-definition")) continue;
          // Den Link zur Grundform lesen: <a href="/wiki/maison#French">
          const dokument = new DOMParser().parseFromString(html, "text/html");
          const link = dokument.querySelector(".form-of-definition-link a");
          if (!link) continue;
          const ziel = (link.getAttribute("href") || "").split("/wiki/")[1] || "";
          const grundform = decodeURIComponent(ziel.split("#")[0]).replace(/_/g, " ");
          if (grundform) return { grundform, beschreibung: formAufDeutsch(htmlEntfernen(html)),
                                  art: eintrag.partOfSpeech, roh: htmlEntfernen(html) };
        }
      }
      return null;
    }

    // Grundform nur dann, wenn das Wort KEINE eigene Bedeutung hat
    // ("maisons" = nur Mehrzahl von "maison"; "reckoning" hat dagegen ein eigenes Nomen).
    function grundformFinden(eintraege) {
      if (eintraege.some(e => eigeneBedeutungen(e).length)) return null;
      return formVerweis(eintraege);
    }

    // Wählt die Wortart, die gezeigt wird.
    // vorliebe = "nomen" (es stand ein Artikel davor: "the reckoning", "das Essen")
    //          = "verb"  (es stand "to" davor: "to reckon")
    //          = ""      (keine Vorliebe -> Reihenfolge wie im Wiktionary)
    // Gibt { art, eintraege (gewählte Wortart zuerst), arten (Anzahl eigener Wortarten) } zurück.
    function wortartWaehlen(eintraege, vorliebe) {
      const eigene = eintraege.filter(e => eigeneBedeutungen(e).length);
      if (!eigene.length) return null;
      let haupt = eigene[0];
      const reihenfolge = { nomen: ["Noun", "Adjective", "Proper noun"], verb: ["Verb"] }[vorliebe] || [];
      for (const art of reihenfolge) {
        const passend = eigene.find(e => e.partOfSpeech === art);
        if (passend) { haupt = passend; break; }
      }
      const eigeneArten = [...new Set(eigene.map(e => e.partOfSpeech))];
      return { art: haupt.partOfSpeech, eintraege: [haupt, ...eintraege.filter(e => e !== haupt)],
               arten: eigeneArten.length, eigeneArten };
    }

    // Ist das Wort BEIDES (eine Form und ein eigenes Wort), schauen wir im Quelltext
    // von Wiktionary nach, ob die eigenen Bedeutungen nur "Nebensache" sind:
    // 1. Die erste Herkunft (Etymology 1) enthält NUR Formen, die eigenen Bedeutungen
    //    stehen erst bei einer späteren Herkunft ("ate" = aß; "ate" = ältere Schwester auf Tagalog).
    // 2. Alle eigenen Bedeutungen sind als veraltet/selten markiert ({{lb|en|obsolete}}),
    //    was die Kurzfassung von Wiktionary leider weglässt ("went" = alter Weg).
    const SPRACH_UEBERSCHRIFT = { en: "English", fr: "French", es: "Spanish", de: "German" };
    const FORM_VORLAGE = /\{\{[^{}|]*(\bof|form of|\bform)\|/;   // {{plural of|...}}, {{infl of|...}}
    async function eigeneNebensaechlich(wort, sprache, arten) {
      const seiten = await seitenHolen(EN_SEITEN_ADRESSE, [wort]);
      if (!seiten[wort]) return false;
      const teile = seiten[wort].split(new RegExp("^==" + SPRACH_UEBERSCHRIFT[sprache] + "==\\s*$", "m"));
      if (teile.length < 2) return false;
      const sprachTeil = teile[1].split(/^==[^=]/m)[0];
      const bedeutungsZeilen = text => text.split("\n").filter(z => /^#+\s/.test(z));

      // Regel 1: mehrere Herkünfte, die erste nur mit Formen
      const herkuenfte = sprachTeil.split(/^===\s*Etymology \d+\s*===\s*$/m).slice(1);
      if (herkuenfte.length > 1) {
        const erste = bedeutungsZeilen(herkuenfte[0]);
        if (erste.length && erste.every(z => FORM_VORLAGE.test(z))) return true;
      }
      const zeilen = [];
      for (const art of arten) {
        const teil = wortartTeil(sprachTeil, art);
        if (teil === sprachTeil) return false;       // Wortart nicht gefunden -> lieber nichts ändern
        zeilen.push(...teil.split("\n").filter(z => /^#+\s/.test(z)));   // nur Bedeutungszeilen
      }
      return zeilen.length > 0 &&
             zeilen.every(z => /\{\{(lb|lbl|label)\|[^}]*\b(obsolete|archaic|rare|dated|nonstandard)\b/.test(z));
    }

    // Groß-/Kleinschreibung: "Haus" und "haus" sind verschiedene Seiten.
    // Darum probieren wir notfalls auch andere Schreibweisen.
    async function eintraegeSuchen(wort, sprache) {
      const gross = wort.charAt(0).toUpperCase() + wort.slice(1).toLowerCase();
      // Deutsch: Nomen werden groß geschrieben -> Großschreibung gleich mitprobieren.
      // Andere Sprachen: zuerst wie eingegeben und klein ("House" -> "house"),
      // groß nur als Notlösung (sonst wird "ate" zur Göttin "Ate").
      const varianten = sprache === "de"
        ? [...new Set([wort, gross, wort.toLowerCase()])]     // ohne doppelte
        : [...new Set([wort, wort.toLowerCase()])];
      const treffer = await variantenProbieren(varianten, sprache)
                   || (sprache !== "de" && !varianten.includes(gross)
                       ? await variantenProbieren([gross], sprache) : null);
      if (treffer) return treffer;

      // Nichts gefunden? Vielleicht fehlt ein Akzent (z. B. "cabron" statt "cabrón").
      // Wir fragen die Wiktionary-Suche nach ähnlichen Seiten und nehmen nur
      // die, die OHNE Akzente genau gleich geschrieben werden.
      const aehnliche = (await aehnlicheSuchen(wort))
        .filter(titel => !varianten.includes(titel))
        .slice(0, 4);                         // höchstens 4 weitere Anfragen
      const treffer2 = await variantenProbieren(aehnliche, sprache);
      if (treffer2) return treffer2;
      return null;
    }

    // Probiert eine Liste von Schreibweisen nacheinander aus.
    // Gibt den ersten Treffer in der gewünschten Sprache zurück (oder null).
    // Beispiel: "haus" ist nur eine Verbform von "hausen" – das Nomen "Haus"
    // ist meistens gemeint. Darum suchen wir weiter, wenn der erste Treffer
    // nur eine "Form von" ist, und nehmen ihn nur, wenn sonst nichts passt.
    async function variantenProbieren(varianten, sprache) {
      let nurForm = null;
      for (const variante of varianten) {
        try {
          const daten = await datenHolen(variante);
          // Die Antwort ist nach Sprachcodes sortiert: { de: [...], en: [...] }
          if (!daten[sprache]) continue;
          const treffer = { gefunden: variante, eintraege: daten[sprache] };
          if (grundformFinden(treffer.eintraege)) {
            if (!nurForm) nurForm = treffer;  // merken, aber weitersuchen
            continue;
          }
          return treffer;
        } catch (e) {
          if (!(e instanceof WortNichtGefunden)) throw e; // andere Fehler weitergeben
        }
      }
      return nurForm;
    }

    // Fragt die Wiktionary-Suche nach Seiten, die bis auf Akzente gleich sind.
    async function aehnlicheSuchen(wort) {
      try {
        const antwort = await fetch(SUCH_ADRESSE + encodeURIComponent(wort),
                                    { headers: { "Api-User-Agent": API_USER_AGENT } });
        if (!antwort.ok) return [];
        const daten = await antwort.json();
        const ziel = ohneAkzente(wort);
        return daten.query.search
          .map(eintrag => eintrag.title)
          .filter(titel => ohneAkzente(titel) === ziel);
      } catch (e) {
        return [];   // Suche ist nur eine Hilfe – bei Problemen einfach weglassen
      }
    }

    // ---------------------------------------------------------------
    // ---------------------------------------------------------------
    // Wortgruppen ("assert itself", "je me souviens", "setzt sich durch"):
    // Im Wörterbuch stehen sie in einer Grundform ("assert oneself",
    // "se souvenir", "sich durchsetzen"). Diese Formen bauen wir hier.
    // ---------------------------------------------------------------
    const SUBJEKTE = {
      en: ["i", "you", "he", "she", "it", "we", "they"],
      fr: ["je", "j'", "tu", "il", "elle", "on", "nous", "vous", "ils", "elles"],
      es: ["yo", "tú", "él", "ella", "usted", "nosotros", "nosotras", "vosotros", "vosotras", "ellos", "ellas", "ustedes"],
      de: ["ich", "du", "er", "sie", "es", "wir", "ihr", "man"],
    };
    // Trennbare Vorsilben deutscher Verben ("setzt sich durch" -> "durchsetzen")
    const VORSILBEN_DE = ["ab", "an", "auf", "aus", "bei", "dar", "durch", "ein", "fest", "fort", "her", "heraus",
                          "hin", "los", "mit", "nach", "vor", "vorbei", "weg", "weiter", "zu", "zurück",
                          "zusammen", "um", "über", "wieder"];

    // Grundform eines (gebeugten) Verbs: "souviens" -> "souvenir", "acuerdo" -> "acordar"
    async function verbGrundform(wort, sprache) {
      try {
        const daten = await datenHolen(wort);
        const verben = (daten[sprache] || []).filter(e => e.partOfSpeech === "Verb");
        const form = formVerweis(verben);
        if (form) return form.grundform;
        if (verben.length) return wort;                 // ist schon die Grundform
      } catch (e) {
        if (!(e instanceof WortNichtGefunden)) throw e;
      }
      return null;
    }

    // Französisch: "se" vor Vokal/h wird zu "s'" ("s'en aller", "s'habiller")
    const seVor = rest => (/^[aeiouhâàéèêîôûœ]/i.test(rest) ? "s'" : "se ") + rest;

    // Liefert mögliche Wörterbuchformen einer Eingabe (ohne die Eingabe selbst)
    async function phrasenVarianten(text, sprache) {
      const ergebnis = [];
      let woerter = text.split(" ");
      // Subjekt am Anfang weg ("je me souviens" -> "me souviens"); bei "j'" hängt es am Wort
      if (woerter.length > 1 && SUBJEKTE[sprache].includes(woerter[0].toLowerCase())) woerter = woerter.slice(1);
      else if (sprache === "fr" && /^j'/i.test(woerter[0]) && woerter.length > 1) woerter[0] = woerter[0].slice(2);

      if (sprache === "en") {
        // itself/himself/... -> oneself, his/her/my/... -> one's (nicht am Anfang)
        const neu = woerter.map((w, i) => {
          if (/^(myself|yourself|himself|herself|itself|ourselves|yourselves|themselves)$/i.test(w)) return "oneself";
          if (i > 0 && /^(my|your|his|her|its|our|their)$/i.test(w)) return "one's";
          return w;
        });
        ergebnis.push(neu.join(" "));
        // Gebeugtes erstes Verb: "loses his temper" -> "lose one's temper"
        if (neu.length > 1) {
          const grund = await verbGrundform(neu[0].toLowerCase(), sprache);
          if (grund && grund !== neu[0].toLowerCase()) ergebnis.push([grund, ...neu.slice(1)].join(" "));
        }
      } else if (sprache === "fr") {
        // "me souviens" / "m'en vais" -> "se souvenir" / "s'en aller"
        let rest = null;
        if (/^(me|te|se|nous|vous)$/i.test(woerter[0]) && woerter.length > 1) rest = woerter.slice(1);
        else if (/^[mts]'./i.test(woerter[0])) rest = [woerter[0].slice(2), ...woerter.slice(1)];
        if (rest) {
          const vorne = /^(en|y)$/i.test(rest[0]) && rest.length > 1 ? [rest[0]] : [];
          const verb = rest[vorne.length];
          const hinten = rest.slice(vorne.length + 1);
          ergebnis.push(seVor(rest.join(" ")));
          const grund = await verbGrundform(verb.toLowerCase(), sprache);
          if (grund) ergebnis.push(seVor([...vorne, grund, ...hinten].join(" ")));
        } else if (woerter.join(" ") !== text) {
          ergebnis.push(woerter.join(" "));
        }
      } else if (sprache === "es") {
        // "acordarme" -> "acordarse", "darme cuenta" -> "darse cuenta"
        const angehaengt = woerter[0].match(/^(.+(?:ar|er|ir|ár|ér|ír))(me|te|nos|os)$/i);
        if (angehaengt) ergebnis.push([angehaengt[1] + "se", ...woerter.slice(1)].join(" "));
        // "me acuerdo" -> "acordarse", "me doy cuenta" -> "darse cuenta"
        if (/^(me|te|se|nos|os)$/i.test(woerter[0]) && woerter.length > 1) {
          const grund = await verbGrundform(woerter[1].toLowerCase(), sprache);
          if (grund) ergebnis.push([grund + "se", ...woerter.slice(2)].join(" "));
        } else if (woerter.join(" ") !== text) {
          ergebnis.push(woerter.join(" "));
        }
      } else if (sprache === "de") {
        // mich/dich/uns/euch -> sich; "setzt sich durch" -> "sich durchsetzen"
        const neu = woerter.map(w => /^(mich|dich|uns|euch|mir|dir)$/i.test(w) ? "sich" : w);
        const ohneSich = neu.filter(w => w.toLowerCase() !== "sich");
        const mitSich = ohneSich.length < neu.length;
        if (ohneSich.length === 2 && VORSILBEN_DE.includes(ohneSich[1].toLowerCase())) {
          const grund = await verbGrundform(ohneSich[0].toLowerCase(), sprache);
          if (grund) {
            const verb = ohneSich[1].toLowerCase() + grund;
            if (mitSich) ergebnis.push("sich " + verb);
            ergebnis.push(verb);
          }
        }
        if (mitSich) {
          ergebnis.push(["sich", ...ohneSich].join(" "));
          ergebnis.push(ohneSich.join(" "));           // "sich durchsetzen" steht unter "durchsetzen"
        }
      }
      return [...new Set(ergebnis)].filter(v => v && v !== text);
    }

    // Wiktionary-Suche nach Seiten, deren Titel ALLE Wörter enthalten
    // ("assert oneself" für "assert itself"); bester Treffer = wenigste zusätzliche Wörter
    async function phraseSuchen(phrase) {
      const woerter = phrase.toLowerCase().split(" ").filter(Boolean);
      const adresse = "https://en.wiktionary.org/w/api.php?action=query&list=search&srprop=&srlimit=20" +
                      "&format=json&formatversion=2&origin=*&srsearch=" +
                      encodeURIComponent(woerter.map(w => "intitle:" + w.replace(/["']/g, "")).join(" "));
      const daten = await jsonHolen(adresse);
      return ((daten && daten.query && daten.query.search) || [])
        .map(e => e.title)
        .filter(t => {
          const teile = t.toLowerCase().split(/\s+/);
          return teile.length > 1 && woerter.every(w => teile.includes(w)) && teile.length <= woerter.length + 2;
        })
        .sort((a, b) => a.split(" ").length - b.split(" ").length)
        .slice(0, 3);
    }

    // Die ganze Suche: Artikel weg, Wortgruppe, Wörterbuchform der Gruppe, Grundform
    // Gibt zurück: { gefunden, eintraege, hinweise: [...] }
    // ---------------------------------------------------------------
    // Beschreibt eine Wortform auf Deutsch ("plural of maison" -> "Mehrzahl").
    // Die englische Beschreibung zeigen wir nicht – alles soll Deutsch sein.
    function formAufDeutsch(englisch) {
      const t = englisch.toLowerCase();
      const teile = [];
      if (t.includes("feminine")) teile.push("weibliche Form");
      if (t.includes("plural")) teile.push("Mehrzahl");
      if (t.includes("past participle")) teile.push("Partizip Perfekt");
      else if (t.includes("present participle") || t.includes("gerund")) teile.push("Verlaufsform (Gerundium)");
      else if (/preterite|simple past|past tense|imperfect/.test(t)) teile.push("Vergangenheitsform");
      else if (/indicative|subjunctive|imperative|person/.test(t)) teile.push("gebeugte Verbform");
      if (/comparative/.test(t)) teile.push("Steigerungsform");
      return teile.length ? teile.join(", ") : "gebeugte Form";
    }

    async function nachschlagen(eingabe, sprache) {
      const hinweise = [];
      let gesucht = artikelEntfernen(eingabe, sprache);
      // Welcher Artikel stand davor? "to" -> Verb gemeint, sonst ein Nomen
      const artikel = gesucht !== eingabe ? eingabe.slice(0, eingabe.length - gesucht.length).trim().toLowerCase() : "";
      const vorliebe = artikel === "to" ? "verb" : (artikel ? "nomen" : "");
      // Deutsch: nach einem Artikel ist ein Nomen gemeint -> groß schreiben ("das essen" -> "Essen")
      if (sprache === "de" && vorliebe === "nomen" && !gesucht.includes(" "))
        gesucht = gesucht.charAt(0).toUpperCase() + gesucht.slice(1);

      // Reihenfolge der Versuche:
      // 1. ohne Artikel ("maison"), 2. so wie eingegeben,
      // 3. Wörterbuchform der Wortgruppe ("assert itself" -> "assert oneself",
      //    "me acuerdo" -> "acordarse", "setzt sich durch" -> "sich durchsetzen")
      // 4. Wiktionary-Suche nach Titeln mit allen Wörtern
      // 5. nichts gefunden: die ganze Wortgruppe übersetzen (NICHT einfach das erste Wort zeigen)
      const woerter = gesucht.split(" ");
      let treffer = null;
      let versuch = "";
      let wortgruppe = false;               // über die Wörterbuchform gefunden?
      const probieren = async (liste) => {
        for (versuch of [...new Set(liste)]) {
          treffer = await eintraegeSuchen(versuch, sprache);
          if (treffer) return true;
        }
        return false;
      };
      // Spanisch "acordarme" -> zuerst "acordarse" (sonst landet man beim nicht-reflexiven "acordar")
      const zuerst = [];
      if (sprache === "es" && !gesucht.includes(" ") && /(ar|er|ir|ár|ér|ír)(me|te|nos|os)$/i.test(gesucht)) {
        zuerst.push(gesucht.replace(/(me|te|nos|os)$/i, "se"));
        wortgruppe = await probieren(zuerst);
      }
      if (!wortgruppe && !await probieren([gesucht, eingabe])) {
        const varianten = await phrasenVarianten(gesucht, sprache);
        wortgruppe = await probieren(varianten);
        if (!wortgruppe && woerter.length > 1) {
          // Suche mit der Wörterbuchform (falls es eine gibt), sonst mit der Eingabe
          for (const p of [...new Set([varianten[0] || gesucht, gesucht])]) {
            wortgruppe = await probieren(await phraseSuchen(p));
            if (wortgruppe) break;
          }
        }
      }
      if (!treffer && woerter.length > 1) {
        // Kein Eintrag für die Wortgruppe: ganze Gruppe übersetzen, Einzelwörter nur als Knöpfe
        const einzel = woerter.filter(w => !ARTIKEL[sprache].includes(w.toLowerCase())).slice(0, 4);
        return { gefunden: gesucht, eintraege: [], hinweise: ["Für „" + gesucht +
                 "“ gibt es keinen eigenen Wörterbucheintrag – hier die Übersetzung der ganzen Wortgruppe."],
                 wahl: null, wortgruppe: { einzel } };
      }
      if (!treffer) throw new WortNichtGefunden();

      // Hinweise sammeln, damit klar ist, was wirklich gesucht wurde
      if (versuch !== eingabe) {
        if (wortgruppe)
          hinweise.push("Eingegeben: „" + eingabe + "“ – im Wörterbuch als „" + versuch + "“");
        else
          hinweise.push("Eingegeben: „" + eingabe + "“ – gesucht: „" + versuch + "“");
      }
      if (ohneAkzente(treffer.gefunden) === ohneAkzente(versuch) &&
          treffer.gefunden.toLowerCase() !== versuch.toLowerCase())
        hinweise.push("Eingegeben: „" + versuch + "“ – gefunden als „" + treffer.gefunden + "“");

      // Reflexiv gemeint ("sich durchsetzen", "se souvenir", "assert oneself")?
      // Dann zeigen wir die reflexiven Bedeutungen zuerst.
      const reflexiv = /(^|\s)(sich|se|oneself)(\s|$)|^s'/i.test(eingabe) || /(^|\s)(sich|se|oneself)(\s|$)|^s'/i.test(versuch);

      // Hat das Wort eigene Bedeutungen? Dann diese zeigen (passende Wortart zuerst).
      // Nur wenn es NUR eine Form ist ("maisons", "went"), holen wir die Grundform.
      let wahl = wortartWaehlen(treffer.eintraege, vorliebe);
      // "Reine" Form-Einträge: alle Bedeutungen sind nur "Form von" (z. B. Verb "reckoning")
      const form = formVerweis(treffer.eintraege.filter(e => !eigeneBedeutungen(e).length));
      // Beides vorhanden? Sind die eigenen Bedeutungen nur veraltet ("went" = alter Weg),
      // dann ist doch die Grundform ("go") gemeint.
      if (wahl && form && await eigeneNebensaechlich(treffer.gefunden, sprache, wahl.eigeneArten)) wahl = null;
      // Sonderfall "to ...": Verb gewünscht, aber das Verb ist nur eine Form -> Grundform
      const verbNurForm = vorliebe === "verb" && wahl && wahl.art !== "Verb" && form && form.art === "Verb";
      if (wahl && !verbNurForm) {
        // Hinweis "ist auch eine Form von" nur bei echten Beugungsformen einer ANDEREN Wortart
        // (also nicht bei "Alternative form of ..." und nicht "Essen" = Mehrzahl von "Esse")
        if (form && form.grundform !== treffer.gefunden && form.beschreibung !== "gebeugte Form" &&
            form.art !== wahl.art) {
          const formArt = form.art === "Verb" || /Gerundium|Partizip|Verbform|Vergangenheit/.test(form.beschreibung)
            ? "Verb" : wortartDeutsch(form.art);
          hinweise.push("„" + treffer.gefunden + "“ ist auch eine Form von „" + form.grundform + "“ (" + formArt + ")");
        }
        // Nur nach der Wortart filtern, wenn klar ist, welche gemeint ist
        return { gefunden: treffer.gefunden, eintraege: wahl.eintraege, hinweise,
                 wahl: { art: wahl.art, filtern: !!vorliebe || wahl.arten === 1, streng: !!vorliebe,
                         artikel: vorliebe === "nomen" ? artikel : "", reflexiv } };
      }
      // Spanisch "acordarse" = "acordar combined with se": das reflexive Verb behalten
      // (de.wiktionary hat dafür eigene Einträge: acordarse = sich erinnern)
      if (form && sprache === "es" && /combined with (se|me|te|nos|os)\b/.test(form.roh || "")) {
        const reflexivForm = treffer.gefunden.replace(/(me|te|nos|os)$/i, "se");
        try {
          const daten = await datenHolen(form.grundform);
          hinweise.push("„" + reflexivForm + "“ ist die reflexive Form von „" + form.grundform + "“");
          return { gefunden: reflexivForm, eintraege: (daten[sprache] || []).filter(e => e.partOfSpeech === "Verb"),
                   hinweise, wahl: { art: "Verb", filtern: true, streng: false, artikel: "", reflexiv: true } };
        } catch (e) {
          if (!(e instanceof WortNichtGefunden)) throw e;
        }
      }
      if (form) {
        try {
          const daten = await datenHolen(form.grundform);
          if (daten[sprache]) {
            hinweise.push("„" + treffer.gefunden + "“ ist eine Form von „" + form.grundform +
                          "“ (" + form.beschreibung + ")");
            const wahl2 = wortartWaehlen(daten[sprache], vorliebe || (form.art === "Verb" ? "verb" : "nomen"));
            return { gefunden: form.grundform, eintraege: wahl2 ? wahl2.eintraege : daten[sprache], hinweise,
                     wahl: wahl2 ? { art: wahl2.art, filtern: false, streng: false } : null };
          }
        } catch (e) {
          if (!(e instanceof WortNichtGefunden)) throw e;
        }
      }
      return { gefunden: treffer.gefunden, eintraege: treffer.eintraege, hinweise, wahl: null };
    }

    // ---------------------------------------------------------------
    // Schritt 5: Ergebnis anzeigen – alles auf Deutsch
    // Wir benutzen textContent (nicht innerHTML) – so kann kein
    // fremder Code in die Seite gelangen.
    // ---------------------------------------------------------------
    function neuesElement(tag, klasse, text) {
      const e = document.createElement(tag);
      if (klasse) e.className = klasse;
      if (text) e.textContent = text;
      return e;
    }

    // Englische Wortarten (aus en.wiktionary) auf Deutsch
    const WORTARTEN = {
      "Noun": "Substantiv", "Proper noun": "Eigenname", "Verb": "Verb", "Adjective": "Adjektiv",
      "Adverb": "Adverb", "Pronoun": "Pronomen", "Preposition": "Präposition",
      "Conjunction": "Konjunktion", "Interjection": "Interjektion", "Article": "Artikel",
      "Determiner": "Begleiter", "Numeral": "Zahlwort", "Participle": "Partizip",
      "Particle": "Partikel", "Phrase": "Redewendung", "Prepositional phrase": "Wortgruppe",
      "Proverb": "Sprichwort", "Contraction": "Zusammenziehung", "Prefix": "Vorsilbe",
      "Suffix": "Nachsilbe", "Abbreviation": "Abkürzung", "Symbol": "Symbol",
    };
    function wortartDeutsch(englisch) { return WORTARTEN[englisch] || englisch || ""; }

    // Kürzel der Sprachen bei Tatoeba (Beispielsätze)
    const TATOEBA_SPRACHE = { de: "deu", en: "eng", es: "spa", fr: "fra" };
    const TATOEBA_ADRESSE = "https://api.tatoeba.org/unstable/sentences?sort=relevance&limit=10";

    // Hilfsfunktion: Adresse holen und JSON zurückgeben (oder null bei Problemen)
    async function jsonHolen(adresse, mitAgent = true) {
      try {
        const antwort = await fetch(adresse,
          mitAgent ? { headers: { "Api-User-Agent": API_USER_AGENT } } : {});
        return antwort.ok ? await antwort.json() : null;
      } catch (e) {
        return null;
      }
    }

    // ---------------------------------------------------------------
    // Wiki-Text (Quelltext von Wiktionary) lesen
    // ---------------------------------------------------------------

    // Wiki-Schreibweise in normalen Text umwandeln, z. B.
    // "das [[Haus]], {{K|ugs.}} [[Bude|die Bude]]"  ->  "das Haus, ugs.: die Bude"
    function wikiTextSaeubern(zeile) {
      let z = zeile;
      z = z.replace(/<ref[^>]*\/>/g, "");                 // Quellen-Hinweise weg
      z = z.replace(/<ref[^>]*>[\s\S]*?<\/ref>/g, "");
      // {{K|ugs.|scherzhaft}} -> "ugs., scherzhaft:"  (K = Kennzeichnung)
      z = z.replace(/\{\{K\|([^{}]*)\}\}/g, (_, inhalt) =>
        inhalt.split("|").filter(teil => !teil.includes("=")).join(", ") + ":");
      // {{Ü|es|conquistador}} -> "conquistador"  (Ü = Übersetzung)
      z = z.replace(/\{\{Ü\|[^|{}]*\|([^|{}]*)[^{}]*\}\}/g, "$1");
      // alle anderen {{Vorlagen}} entfernen (von innen nach außen)
      while (/\{\{[^{}]*\}\}/.test(z)) z = z.replace(/\{\{[^{}]*\}\}/g, "");
      // [[Ziel|Text]] -> Text   und   [[Wort]] -> Wort
      z = z.replace(/\[\[(?:[^\]|]*\|)?([^\]]*)\]\]/g, "$1");
      // "l'''eau''" = Apostroph + kursiv -> "l'eau" (sonst verschwindet der Apostroph)
      z = z.replace(/'''([^']+?)''(?!')/g, "'$1");
      z = z.replace(/'{2,}/g, "");                        // Kursiv- und Fett-Zeichen ('' und ''')
      return htmlEntfernen(z);                            // restliches HTML und &nbsp; usw.
    }

    // Schneidet aus einer Seite den Teil der richtigen Sprache heraus,
    // z. B. alles unter "== casa ({{Sprache|Spanisch}}) ==" bis zur nächsten Sprache.
    function sprachAbschnitt(wikitext, sprachName) {
      const teile = wikitext.split(/^(?===[^=])/m);   // bei jeder Sprach-Überschrift teilen
      for (const teil of teile) {
        const kopf = teil.split("\n")[0];
        const m = kopf.match(/\{\{Sprache\|([^}|]+)/);
        if (m && m[1].trim() === sprachName) return teil;
      }
      return "";
    }

    // Holt die Zeilen eines Blocks, z. B. unter {{Bedeutungen}} oder {{Beispiele}}.
    // Gibt Paare zurück: { text, unterzeilen: [...] }  (Unterzeilen beginnen mit "::")
    // Die Wortart merken wir uns aus Überschriften wie "=== {{Wortart|Substantiv|Spanisch}} ===".
    function blockLesen(abschnitt, blockName) {
      const ergebnis = [];
      let wortart = "";
      let imBlock = false;
      for (const zeile of abschnitt.split("\n")) {
        const art = zeile.match(/^===.*?\{\{Wortart\|([^|}]+)/);
        if (art) { wortart = art[1]; imBlock = false; continue; }
        if (zeile.startsWith("{{" + blockName + "}}")) { imBlock = true; continue; }
        if (!imBlock) continue;
        if (zeile.startsWith("::")) {                // Unterzeile (z. B. Übersetzung)
          if (ergebnis.length) ergebnis[ergebnis.length - 1].unterzeilen.push(wikiTextSaeubern(zeile.slice(2)));
        } else if (zeile.startsWith(":")) {
          // ":[1] das Haus" -> "das Haus"
          const roh = zeile.replace(/^:\s*(\[[^\]]*\])?/, "");
          if (/Beispiele fehlen/.test(roh)) continue;  // Platzhalter "Beispiel fehlt"
          const text = wikiTextSaeubern(roh);
          if (text) ergebnis.push({ text, wortart, unterzeilen: [] });
        } else if (!zeile.startsWith("*")) {
          imBlock = false;                           // Block ist zu Ende
        }
      }
      return ergebnis;
    }

    // Mehrere Seiten auf einmal holen (Titel mit | getrennt). Gibt { titel: wikitext } zurück.
    async function seitenHolen(basisAdresse, titelListe) {
      const daten = await jsonHolen(basisAdresse + encodeURIComponent(titelListe.join("|")));
      const abfrage = (daten && daten.query) || {};
      const seiten = {};
      for (const seite of abfrage.pages || []) {
        if (!seite.missing && seite.revisions) seiten[seite.title] = seite.revisions[0].slots.main.content;
      }
      // Umbenennungen berücksichtigen (Weiterleitung oder Normalisierung)
      for (const w of [...(abfrage.normalized || []), ...(abfrage.redirects || [])]) {
        if (seiten[w.to]) seiten[w.from] = seiten[w.to];
      }
      return seiten;
    }

    // ---------------------------------------------------------------
    // Quellen für die deutsche Bedeutung
    // ---------------------------------------------------------------

    // Quelle 1: der passende Eintrag im deutschen Wiktionary
    // Gibt { titel, bedeutungen, beispiele } zurück (oder null)
    // Englische Wortart (en.wiktionary) -> Namen im deutschen Wiktionary
    const DE_WORTARTEN = {
      "Noun": ["Substantiv"], "Verb": ["Verb"], "Adjective": ["Adjektiv"], "Adverb": ["Adverb"],
      "Proper noun": ["Eigenname", "Toponym", "Vorname", "Nachname"],
      "Interjection": ["Interjektion"], "Participle": ["Partizip I", "Partizip II"],
    };

    // wahl = { art, filtern, streng } aus nachschlagen():
    // filtern -> nur Bedeutungen/Beispiele der gewählten Wortart zeigen
    // streng  -> passt keine, lieber die nächste Quelle fragen (statt einer falschen Wortart)
    async function deutschenEintragHolen(varianten, sprache, wahl) {
      const namen = wahl && wahl.filtern ? DE_WORTARTEN[wahl.art] : null;
      const passt = b => !namen || namen.includes(b.wortart);
      const seiten = await seitenHolen(DE_ADRESSE, varianten);
      for (const titel of varianten) {
        if (!seiten[titel]) continue;
        const abschnitt = sprachAbschnitt(seiten[titel], SPRACHEN[sprache]);
        if (!abschnitt) continue;
        const alle = blockLesen(abschnitt, "Bedeutungen");
        const beispiele = blockLesen(abschnitt, "Beispiele");
        if (!alle.length) continue;
        const bedeutungen = alle.filter(passt);
        if (bedeutungen.length) return { titel, bedeutungen, beispiele: beispiele.filter(passt) };
        // Keine passende Wortart: nur nehmen, wenn wir nicht streng sein müssen
        if (!wahl || !wahl.streng) return { titel, bedeutungen: alle, beispiele };
      }
      return null;
    }

    // Quelle 2: deutsche Einträge, deren Übersetzungstabelle das Wort nennt.
    // Beispiel: Die Seite "Eroberer" enthält {{Ü|es|conquistador}}.
    async function rueckwaertsSuchen(wort, sprache) {
      const adresse = "https://de.wiktionary.org/w/api.php?action=query&list=search&srprop=" +
                      "&srlimit=4&format=json&formatversion=2&origin=*&srsearch=" +
                      encodeURIComponent('insource:"Ü|' + sprache + "|" + wort + '"');
      const daten = await jsonHolen(adresse);
      const titel = ((daten && daten.query && daten.query.search) || []).map(e => e.title);
      return titel.length ? titel : null;
    }

    // Englische Stichwörter aus den Bedeutungen sammeln:
    // "conquering; winning" / "conqueror, conquistador" -> conquering, winning, conqueror, ...
    function englischeStichwoerter(eintraege) {
      const liste = [];
      const kopfwoerter = [];
      let gezaehlt = 0;
      for (const eintrag of eintraege) {
        for (const definition of (eintrag.definitions || [])) {
          const html = definition.definition || "";
          if (html.includes("form-of-definition") || !htmlEntfernen(html)) continue;
          if (++gezaehlt > 4) break;                 // nur die ersten 4 Bedeutungen
          const text = htmlEntfernen(html).replace(/\([^)]*\)/g, " ");   // Klammern weg
          for (let teil of text.split(/[,;:.]/)) {
            teil = teil.trim().replace(/^(to|a|an|the)\s+/i, "").trim();
            // Wortart merken, damit wir sie später (auf Deutsch) anzeigen können
            if (teil && teil.split(" ").length <= 3 && !liste.some(x => x.wort === teil))
              liste.push({ wort: teil, art: eintrag.partOfSpeech });
            // Bei "brilliantly showy" auch das Hauptwort am Ende ("showy") merken –
            // es kommt erst nach allen ganzen Stichwörtern dran (nicht bei Verben: "put off")
            const teile = teil.split(" ");
            const kopf = teile[teile.length - 1].toLowerCase();
            if (teile.length >= 2 && teile.length <= 3 && eintrag.partOfSpeech !== "Verb" &&
                kopf.length > 3 && !kopfwoerter.some(x => x.wort === kopf))
              kopfwoerter.push({ wort: kopf, art: eintrag.partOfSpeech });
          }
        }
      }
      const alle = [...liste];
      for (const k of kopfwoerter) if (!alle.some(x => x.wort === k.wort)) alle.push(k);
      return alle.slice(0, 10);
    }

    const ARTIKEL_DE = { m: "der", f: "die", n: "das", p: "die" };

    // Liest aus dem Wiki-Text die deutschen Wörter der ersten geprüften Tabelle
    function deutscheUebersetzungen(wikitext) {
      let sinn = "";
      let ungeprueft = false;
      const alle = [];
      let ersterSinn = "";
      let tabellen = 0;
      for (const zeile of wikitext.split("\n")) {
        const kopf = zeile.match(/\{\{(trans-top|checktrans-top)[^|}]*\|?([^|}]*)/);
        if (kopf) {
          // Neue Tabelle beginnt; "checktrans" = noch nicht geprüft -> überspringen
          ungeprueft = kopf[1] === "checktrans-top";
          sinn = wikiTextSaeubern(kopf[2] || "");
          continue;
        }
        if (ungeprueft || !/^\*\s*German\s*:/.test(zeile)) continue;
        // {{t+|de|Möglichkeit|f}}  (auch t, tt, tt+)
        const woerter = [];
        // Das Wort darf selbst Links enthalten: {{t|de|[[glücklich]]er [[Zufall]]}}
        for (const m of zeile.matchAll(/\{\{tt?\+?\|de\|((?:\[\[[^\]]*\]\]|[^|}\[])+)(?:\|([mfnp]))?/g)) {
          const wort = wikiTextSaeubern(m[1]);
          // Artikel nur bei einzelnen Wörtern ("die Katze", aber "glücklicher Zufall")
          woerter.push(m[2] && !wort.includes(" ") ? ARTIKEL_DE[m[2]] + " " + wort : wort);
        }
        if (!woerter.length) continue;
        // Aus bis zu 3 Tabellen (Bedeutungen) je bis zu 3 Wörter sammeln
        for (const w of woerter.slice(0, 3)) if (!alle.includes(w)) alle.push(w);
        if (!ersterSinn) ersterSinn = sinn;
        if (++tabellen >= 3) break;
      }
      return alle.length ? { woerter: alle.slice(0, 6), sinn: ersterSinn } : null;
    }

    // Schneidet den Teil einer Wortart heraus (z. B. "===Noun===" bis zur nächsten Wortart).
    // Gibt es die Wortart auf der Seite nicht, bleibt der Text, wie er ist.
    function wortartTeil(wikitext, art) {
      if (!art) return wikitext;
      const zeilen = wikitext.split("\n");
      const istArt = z => { const m = z.match(/^={3,5}\s*([^=]+?)\s*={3,5}\s*$/); return m && WORTARTEN[m[1]] ? m[1] : null; };
      const start = zeilen.findIndex(z => istArt(z) === art);
      if (start < 0) return wikitext;
      let ende = zeilen.length;
      for (let i = start + 1; i < zeilen.length; i++) if (istArt(zeilen[i])) { ende = i; break; }
      return zeilen.slice(start, ende).join("\n");
    }

    // Quelle 3: Übersetzungstabellen im englischen Wiktionary.
    // Wir fragen alle Stichwörter (und ihre "/translations"-Unterseiten) auf einmal ab.
    async function deutschUeberEnglisch(stichwoerter, art) {
      const titel = [];
      for (const s of stichwoerter) titel.push(s + "/translations", s);
      const seiten = await seitenHolen(EN_SEITEN_ADRESSE, titel);
      for (const s of stichwoerter) {
        for (const t of [s + "/translations", s]) {
          if (!seiten[t]) continue;
          // Nur den englischen Teil der Seite nehmen (bis zur nächsten Sprache)
          const englisch = (seiten[t].split(/^==English==\s*$/m)[1] || seiten[t]).split(/^==[^=]/m)[0];
          const gefunden = deutscheUebersetzungen(wortartTeil(englisch, art));
          if (gefunden) return { ...gefunden, seite: s };
        }
      }
      return null;
    }

    // Quelle 4 (Notlösung): maschinelle Übersetzung (MyMemory, kostenlos, ohne Schlüssel)
    async function maschinellUebersetzen(text, sprache) {
      const daten = await jsonHolen(MT_ADRESSE + sprache + "|de&q=" + encodeURIComponent(text), false);
      if (!daten || daten.responseStatus !== 200 || daten.quotaFinished) return null;
      const ergebnis = htmlEntfernen(daten.responseData && daten.responseData.translatedText);
      // Kam der Text unverändert zurück? Dann ist es keine echte Übersetzung.
      if (!ergebnis || ergebnis.toLowerCase() === text.toLowerCase()) return null;
      return ergebnis;
    }

    // Sucht die deutsche Bedeutung in der Reihenfolge 1 -> 4.
    // Gibt { zeilen: [{text, wortart}], quelle, eintrag } zurück.
    async function deutscheBedeutungFinden(gefunden, eingabe, sprache, eintraege, wahl) {
      const gross = gefunden.charAt(0).toUpperCase() + gefunden.slice(1);
      const varianten = [...new Set([gefunden, gross, gefunden.toLowerCase(), eingabe])];

      const eintrag = await deutschenEintragHolen(varianten, sprache, wahl);
      if (eintrag) return { zeilen: eintrag.bedeutungen, eintrag,
        quelle: "Quelle: de.wiktionary.org (Eintrag „" + eintrag.titel + "“)" };
      if (sprache === "de") return { zeilen: [], quelle: "" };   // Deutsch: nichts übersetzen

      // Quelle 2 und 3 gleichzeitig fragen (spart Zeit):
      // 2 = Übersetzungstabellen im englischen Wiktionary (über die englische Bedeutung)
      // 3 = deutsche Einträge, die das Wort als Übersetzung nennen (Rückwärtssuche)
      // Ist die Wortart klar, nur deren Bedeutungen und Tabellen benutzen
      const art = wahl && wahl.filtern ? wahl.art : "";
      // Englisch: zuerst die Tabelle des Wortes selbst, dann die seiner Erklärung
      // ("glitzy" hat keine Tabelle -> "Brilliantly showy" -> "showy" = protzig, auffällig)
      const stichListe = englischeStichwoerter(art ? eintraege.filter(e => e.partOfSpeech === art) : eintraege);
      const liste = sprache === "en"
        ? [{ wort: gefunden, art }, ...stichListe.filter(x => x.wort.toLowerCase() !== gefunden.toLowerCase())]
        : stichListe;
      const stichwoerter = liste.map(x => x.wort);
      // (Rückwärtssuche nicht bei Wortgruppen: die findet dort oft nur ungefähr Passendes)
      const [tabelle, rueck] = await Promise.all([
        stichwoerter.length ? deutschUeberEnglisch(stichwoerter, art) : null,
        gefunden.includes(" ") ? null : rueckwaertsSuchen(gefunden, sprache),
      ]);
      if (tabelle) {
        // Die Rückwärtssuche liefert oft auch verwandte Wörter ("Sitzgelegenheit").
        // Darum nur als Bestätigung: Wörter, die in beiden Quellen stehen.
        const ohneArtikel = w => w.replace(/^(der|die|das) /, "");
        const bestaetigt = (rueck || []).filter(t => tabelle.woerter.some(w => ohneArtikel(w) === t));
        // (Die englische Erklärung der Tabelle zeigen wir nicht – alles soll Deutsch sein.)
        const art = (liste.find(x => x.wort === tabelle.seite) || {}).art;
        return { zeilen: [{ text: tabelle.woerter.join(", "), wortart: art ? wortartDeutsch(art) : "" }],
          quelle: "Quelle: en.wiktionary.org – Übersetzungstabelle von „" + tabelle.seite + "“" +
                  (tabelle.seite.toLowerCase() === gefunden.toLowerCase() ? "" : " (über die englische Bedeutung)") +
                  (bestaetigt.length ? "; bestätigt durch de.wiktionary („" + bestaetigt.join("“, „") + "“)" : "") };
      }
      if (rueck) return { zeilen: [{ text: rueck.join(", ") }],
        quelle: "Quelle: de.wiktionary.org – deutsche Einträge, die „" + gefunden +
                "“ als " + SPRACHEN[sprache] + "-Übersetzung nennen" };

      // Wortgruppe ohne Eintrag: gibt es bei Tatoeba genau diesen Satz ("Take care!")?
      // Dann ist dessen deutsche Übersetzung von Menschen gemacht.
      if (!eintraege.length && gefunden.includes(" ")) {
        const satz = await tatoebaGanzerSatz(gefunden, sprache);
        if (satz) return { zeilen: [{ text: satz.deutsch }],
          quelle: "Quelle: tatoeba.org (Satz „" + satz.text + "“)" };
      }
      const mt = await maschinellUebersetzen(gefunden, sprache);
      if (mt) return { zeilen: [{ text: mt }], quelle: (gefunden.includes(" ")
        ? "Maschinelle Übersetzung der ganzen Wortgruppe (MyMemory)" : "Maschinelle Übersetzung (MyMemory)") +
        " – kann ungenau sein" };
      return { zeilen: [], quelle: "" };
    }

    // Tatoeba-Satz, der GENAU aus der Wortgruppe besteht ("Take care." für "take care")
    async function tatoebaGanzerSatz(phrase, sprache) {
      const nurWoerter = t => t.toLowerCase().replace(/[^\p{L}\p{N}' ]+/gu, " ").replace(/\s+/g, " ").trim();
      const adresse = TATOEBA_ADRESSE + "&lang=" + TATOEBA_SPRACHE[sprache] + "&q=" +
                      encodeURIComponent('"' + phrase + '"') + "&" + encodeURIComponent("trans:lang") + "=deu";
      const daten = await jsonHolen(adresse, false);
      for (const s of ((daten && daten.data) || [])) {
        if (nurWoerter(s.text) !== nurWoerter(phrase)) continue;
        const uebers = (s.translations || []).filter(t => t.lang === "deu");
        const beste = uebers.find(t => t.is_direct) || uebers[0];
        if (beste) return { text: s.text, deutsch: beste.text };
      }
      return null;
    }

    // ---------------------------------------------------------------
    // Quellen für den Beispielsatz (immer mit deutscher Übersetzung)
    // ---------------------------------------------------------------

    // Tatoeba: echte Sätze von Freiwilligen, mit deutscher Übersetzung.
    // "=wort" sucht genau diese Wortform.
    async function tatoebaBeispiel(woerter, sprache, phrasen = []) {
      // Durchgang 1: genau diese Wortform ("=wort").
      // Durchgang 2: auch andere Formen ("bouquiner" -> "bouquine"), aber nur Sätze,
      // in denen ein Wort mit demselben Anfang vorkommt (Wort ohne den letzten Buchstaben).
      // Durchgang 0: fertige Suchen, z. B. '"=the =building"' (Nomen mit Artikel)
      const versuche = [...phrasen.map(p => ({ wort: p, genau: true, fertig: true })),
                        ...woerter.map(w => ({ wort: w, genau: true }))];
      if (!woerter[0].includes(" ") && woerter[0].length >= 5) versuche.push({ wort: woerter[0], genau: false });
      for (const { wort, genau, fertig } of versuche) {
        const suche = fertig ? wort : wort.includes(" ") ? '"' + wort + '"' : (genau ? "=" : "") + wort;
        let adresse = TATOEBA_ADRESSE + "&lang=" + TATOEBA_SPRACHE[sprache] + "&q=" + encodeURIComponent(suche);
        if (sprache !== "de") adresse += "&" + encodeURIComponent("trans:lang") + "=deu";
        const daten = await jsonHolen(adresse, false);
        let saetze = (daten && daten.data) || [];
        if (!genau) {
          const anfang = wort.slice(0, -1).toLowerCase();
          saetze = saetze.filter(s => s.text.toLowerCase().split(/[^\p{L}]+/u).some(t => t.startsWith(anfang)));
        }
        // Lieber einen richtigen Satz (mind. 3 Wörter, nicht zu lang) als "Maison !"
        const passend = saetze.find(s => s.text.split(" ").length >= 3 && s.text.length <= 120) || saetze[0];
        if (!passend) continue;
        if (sprache === "de") return { satz: passend.text, deutsch: "",
                                       quelle: "Quelle: tatoeba.org" + (genau ? "" : " (Satz mit einer anderen Form des Wortes)") };
        const uebers = (passend.translations || []).filter(t => t.lang === "deu");
        const beste = uebers.find(t => t.is_direct) || uebers[0];
        if (beste) return { satz: passend.text, deutsch: beste.text,
                            quelle: "Quelle: tatoeba.org" + (genau ? "" : " (Satz mit einer anderen Form des Wortes)") };
      }
      return null;
    }

    // Sucht einen Beispielsatz in der Reihenfolge:
    // 1. de.wiktionary (mit deutscher Übersetzung), 2. Tatoeba,
    // 3. en.wiktionary-Satz + maschinelle deutsche Übersetzung (gekennzeichnet)
    // Typische Artikel, um bei Nomen auch Sätze mit dem NOMEN zu finden
    // ("the building" statt "What are they building?")
    const SATZ_ARTIKEL = { en: ["the", "a"], fr: ["le", "la", "l'"], es: ["el", "la"] };

    async function beispielFinden(gefunden, eingabe, sprache, eintraege, deEintrag, wahl) {
      const kurz = b => b.text.length <= 160;
      const deBeispiele = (deEintrag && deEintrag.beispiele) || [];
      if (sprache === "de") {
        // Zitate aus Zeitungen/Büchern stehen in „…“ und sind oft lang -> lieber einfache Sätze
        // Reflexiv gemeint ("sich durchsetzen")? Dann lieber ein Satz mit "sich"
        const refl = x => !(wahl && wahl.reflexiv) || /\bsich\b/i.test(x.text);
        const b = deBeispiele.find(x => kurz(x) && !x.text.startsWith("„") && refl(x)) ||
                  deBeispiele.find(x => kurz(x) && !x.text.startsWith("„"));
        if (b) return { satz: b.text, deutsch: "", quelle: "Quelle: de.wiktionary.org" };
      } else {
        const b = deBeispiele.find(x => x.unterzeilen.length && kurz(x));
        if (b) return { satz: b.text, deutsch: b.unterzeilen[0], quelle: "Quelle: de.wiktionary.org" };
      }

      // Auch die Eingabe selbst suchen ("assert itself" findet mehr Sätze als "assert oneself")
      const ohneArtikel = artikelEntfernen(eingabe, sprache);
      const formen = [...new Set([gefunden, eingabe.toLowerCase() === gefunden.toLowerCase() ? gefunden : eingabe,
                                  ...(ohneArtikel.includes(" ") ? [ohneArtikel] : [])])];
      // Nomen (Wortart klar): zuerst Sätze mit Artikel davor suchen
      const phrasen = [];
      if (wahl && wahl.filtern && wahl.art === "Noun" && SATZ_ARTIKEL[sprache]) {
        const artikelListe = [...new Set([wahl.artikel, ...SATZ_ARTIKEL[sprache]].filter(Boolean))];
        for (const a of artikelListe) {
          phrasen.push(a.endsWith("'") ? '"=' + a + gefunden + '"' : '"=' + a + " =" + gefunden + '"');
        }
      }
      // "assert oneself" kommt in echten Sätzen als "assert himself/herself/..." vor
      if (sprache === "en" && /\b(oneself|one's)\b/.test(gefunden)) {
        const ersatz = /\boneself\b/.test(gefunden) ? ["himself", "herself", "itself", "myself", "yourself", "themselves"]
                                                    : ["his", "her", "my", "your", "their"];
        phrasen.push(ersatz.map(p => '"' + gefunden.replace(/\b(oneself|one's)\b/, p) + '"').join(" | "));
      }
      const tatoeba = await tatoebaBeispiel(formen, sprache, phrasen.slice(0, 3));
      if (tatoeba) return tatoeba;

      if (sprache === "de" && deBeispiele.length) {      // Zitate nur als Notlösung (das kürzeste)
        const b = [...deBeispiele].sort((x, y) => x.text.length - y.text.length)[0];
        return { satz: b.text, deutsch: "", quelle: "Quelle: de.wiktionary.org" };
      }

      // Ab hier: echte Sätze OHNE menschliche deutsche Übersetzung -> maschinell übersetzen.
      // Reihenfolge: en.wiktionary-Beispiel, en.wiktionary-Zitat, Wikipedia.
      const kandidaten = [];
      for (const eintrag of eintraege) {
        for (const definition of (eintrag.definitions || [])) {
          for (const b of (definition.parsedExamples || [])) {
            const satz = htmlEntfernen(b.example);
            if (satz) kandidaten.push({ satz, herkunft: "en.wiktionary.org" });
          }
        }
      }
      let satz = kandidaten.length ? kandidaten[0] : null;
      if (!satz) satz = await zitatAusWiktionary(gefunden, sprache);
      if (!satz) satz = await satzAusWikipedia(gefunden, sprache);
      if (!satz && ohneArtikel.includes(" ") && ohneArtikel !== gefunden) satz = await satzAusWikipedia(ohneArtikel, sprache);
      // "assert oneself" steht in Texten als "assert itself/himself"
      for (const p of ["itself", "himself"]) {
        if (!satz && sprache === "en" && /\boneself\b/.test(gefunden))
          satz = await satzAusWikipedia(gefunden.replace(/\boneself\b/, p), sprache);
      }
      if (!satz) return null;
      if (sprache === "de") return { satz: satz.satz, deutsch: "", quelle: "Quelle: " + satz.herkunft };
      const deutsch = await maschinellUebersetzen(satz.satz, sprache);
      if (deutsch) return { satz: satz.satz, deutsch, quelle: "Satz aus " + satz.herkunft +
                            " – maschinell übersetzt (MyMemory), kann ungenau sein" };
      return { satz: satz.satz, deutsch: "", quelle: "Satz aus " + satz.herkunft +
               " – leider ohne deutsche Übersetzung (Übersetzungsdienst nicht erreichbar)" };
    }

    // ---------------------------------------------------------------
    // Weitere Quellen für echte Sätze (ohne deutsche Übersetzung)
    // ---------------------------------------------------------------

    // Sucht in einem Text den besten Satz mit dem Wort:
    // ganzes Wort, 6–30 Wörter, möglichst um die 14 Wörter lang.
    function besterSatz(text, wort) {
      const muster = new RegExp("(^|[^\\p{L}])" + wort.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") +
                                "($|[^\\p{L}])", "iu");
      // Genau so geschrieben (Groß-/Kleinschreibung) ist besser: "Le Débrouillard" ist ein Filmtitel
      const genau = new RegExp("(^|[^\\p{L}])" + wort.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") +
                               "($|[^\\p{L}])", "u");
      // In Sätze teilen – aber nicht nach Abkürzungen wie "C. P." oder "z. B."
      const saetze = text.replace(/\s+/g, " ").split(/(?<![\s.(]\p{L}\.)(?<=[.!?…])\s+(?=[\p{Lu}„"«¿¡])/u);
      let bester = null;
      for (let s of saetze) {
        s = s.trim();
        const anzahl = s.split(" ").length;
        if (!muster.test(s) || anzahl < 6 || anzahl > 30 || /[{}=|\[\]]/.test(s)) continue;
        if (!/^[\p{Lu}„"«¿¡]/u.test(s) || /^\p{Lu}\.\s/u.test(s)) continue;   // kein Satzanfang
        // Anders geschrieben nur am Satzanfang erlaubt ("Glitzy …"), sonst ist es meist ein Name
        if (!genau.test(s) && !s.toLowerCase().startsWith(wort.toLowerCase())) continue;
        const abstand = Math.abs(anzahl - 14);
        if (!bester || abstand < bester.abstand) bester = { satz: s, abstand };
      }
      return bester ? bester.satz : null;
    }

    // Liest die Teile einer Wiki-Vorlage {{name|a|b=c}} (mit verschachtelten Vorlagen)
    function vorlagenTeile(innen) {
      const teile = [];
      let tiefe = 0, aktuell = "";
      for (let i = 0; i < innen.length; i++) {
        const z = innen[i], z2 = innen.slice(i, i + 2);
        if (z2 === "{{" || z2 === "[[") { tiefe++; aktuell += z2; i++; continue; }
        if ((z2 === "}}" || z2 === "]]") && tiefe > 0) { tiefe--; aktuell += z2; i++; continue; }
        if (z === "|" && tiefe === 0) { teile.push(aktuell); aktuell = ""; continue; }
        aktuell += z;
      }
      teile.push(aktuell);
      return teile;
    }

    // Findet alle Vorlagen {{...}} der obersten Ebene in einem Text
    function vorlagenFinden(text) {
      const gefunden = [];
      let tiefe = 0, start = -1;
      for (let i = 0; i < text.length - 1; i++) {
        const z2 = text.slice(i, i + 2);
        if (z2 === "{{") { if (tiefe === 0) start = i; tiefe++; i++; }
        else if (z2 === "}}" && tiefe > 0) { tiefe--; i++; if (tiefe === 0) gefunden.push(text.slice(start + 2, i - 1)); }
      }
      return gefunden;
    }

    // Wiki-Text eines Zitats lesbar machen: {{w|Olivia Dean}} -> Olivia Dean
    function zitatSaeubern(text) {
      let t = text;
      // Von innen nach außen: Vorlagen, deren Text sichtbar bleibt, durch den Text ersetzen
      // {{w|Olivia Dean|{{q-g|Olivia}} Dean}} -> "Olivia Dean"; {{l|en|word}} -> "word"
      for (let runde = 0; runde < 5 && /\{\{[^{}]*\}\}/.test(t); runde++) {
        t = t.replace(/\{\{([^{}]*)\}\}/g, (ganz, innen) => {
          const teile = innen.split("|").filter(x => !x.includes("="));
          const name = teile[0].trim();
          if (name === "w") return teile[2] || teile[1] || "";
          if (/^(l|m|lang|ll)$/.test(name)) return teile[3] || teile[2] || "";
          if (/^(q-g|qualifier|gloss|nowrap)$/.test(name)) return teile[1] || "";
          return "";                                   // alles andere weglassen
        });
      }
      return wikiTextSaeubern(t);
    }

    // Quelle: Zitate und Beispiele im vollen en.wiktionary-Eintrag
    // ({{quote-book|…|passage=…}}, {{ux|es|…}}), die die Kurzfassung nicht liefert
    async function zitatAusWiktionary(wort, sprache) {
      const seiten = await seitenHolen(EN_SEITEN_ADRESSE, [wort]);
      if (!seiten[wort]) return null;
      const teile = seiten[wort].split(new RegExp("^==" + SPRACH_UEBERSCHRIFT[sprache] + "==\\s*$", "m"));
      if (teile.length < 2) return null;
      const sprachTeil = teile[1].split(/^==[^=]/m)[0];
      const texte = [];
      for (const vorlage of vorlagenFinden(sprachTeil)) {
        const t = vorlagenTeile(vorlage);
        const name = t[0].trim();
        if (/^quote-/.test(name)) {
          const stelle = t.find(x => /^\s*(passage|text)\s*=/.test(x));
          if (stelle) texte.push(stelle.replace(/^\s*(passage|text)\s*=/, ""));
        } else if (/^(ux|uxi|usex|ux-lite)$/.test(name) && t[2]) {
          texte.push(t[2]);
        }
      }
      for (const roh of texte) {
        const satz = besterSatz(zitatSaeubern(roh), wort);
        if (satz) return { satz, herkunft: "en.wiktionary.org (Zitat)" };
      }
      return null;
    }

    // Quelle: Wikipedia in der Sprache des Wortes (Volltextsuche, dann Artikeltext)
    async function satzAusWikipedia(wort, sprache) {
      const basis = "https://" + sprache + ".wikipedia.org/w/api.php?format=json&formatversion=2&origin=*";
      const suche = await jsonHolen(basis + "&action=query&list=search&srwhat=text&srlimit=10&srprop=snippet" +
                                    "&srsearch=" + encodeURIComponent('"' + wort + '"'));
      // Treffer, deren Vorschau das Wort genau so geschrieben enthält, zuerst
      // (sonst sind es oft Buchtitel in den Quellenangaben: „Bouquiner avec …“)
      const treffer = (suche && suche.query && suche.query.search) || [];
      const genauDrin = e => (e.snippet || "").includes('<span class="searchmatch">' + wort + "</span>");
      const titel = [...treffer.filter(genauDrin), ...treffer.filter(e => !genauDrin(e))]
                    .map(e => e.title).slice(0, 3);
      // Die Artikel gleichzeitig holen (als reiner Text)
      const texte = await Promise.all(titel.map(t => jsonHolen(basis +
        "&action=query&prop=extracts&explaintext=1&exsectionformat=plain&redirects=1&titles=" + encodeURIComponent(t))));
      let bester = null;
      texte.forEach((daten, i) => {
        const seite = daten && daten.query && daten.query.pages && daten.query.pages[0];
        const satz = seite && seite.extract ? besterSatz(seite.extract, wort) : null;
        if (satz && (!bester || Math.abs(satz.split(" ").length - 14) < Math.abs(bester.satz.split(" ").length - 14)))
          bester = { satz, herkunft: sprache + ".wikipedia.org („" + titel[i] + "“)" };
      });
      return bester;
    }

    // ---------------------------------------------------------------
    // Alles zusammen anzeigen
    // ---------------------------------------------------------------
    async function ergebnisZeigen(gefunden, eingabe, sprache, eintraege, hinweise, wahl, wortgruppe) {
      ergebnis.innerHTML = "";   // altes Ergebnis löschen
      ergebnis.appendChild(neuesElement("h2", "", gefunden + " (" + SPRACHEN[sprache] + ")"));
      const wortartZeile = neuesElement("div", "wortart", "");
      ergebnis.appendChild(wortartZeile);
      // Hinweise, z. B. "Eingegeben: „la maison“ – gesucht: „maison“"
      for (const text of hinweise) ergebnis.appendChild(neuesElement("div", "hinweis", text));

      // Kasten 1: deutsche Bedeutung (Hauptteil)
      const deKasten = neuesElement("div", "deutsch");
      deKasten.appendChild(neuesElement("h3", "", sprache === "de" ? "Bedeutung auf Deutsch" : "Auf Deutsch"));
      const deInhalt = neuesElement("div", "", "Lädt …");
      const deQuelle = neuesElement("div", "hinweis", "");
      deKasten.append(deInhalt, deQuelle);

      // Kasten 2: Beispielsatz
      const bspKasten = neuesElement("div", "beispiel");
      bspKasten.appendChild(neuesElement("h3", "", "Beispiel"));
      const bspInhalt = neuesElement("div", "", "Lädt …");
      const bspQuelle = neuesElement("div", "hinweis", "");
      bspKasten.append(bspInhalt, bspQuelle);
      ergebnis.append(deKasten, bspKasten);

      // Klappbereich: englische Erklärung (nur bei Bedarf aufklappen)
      const klapp = document.createElement("details");
      klapp.appendChild(neuesElement("summary", "", "Englische Erklärung anzeigen"));
      let nummer = 0;
      for (const eintrag of eintraege) {
        if (eintrag.partOfSpeech === "Symbol") continue;   // Sprachcodes weglassen
        for (const definition of (eintrag.definitions || [])) {
          const text = htmlEntfernen(definition.definition);
          if (!text || ++nummer > 5) continue;
          const zeile = neuesElement("div", "bedeutung", nummer + ". " + text + " ");
          zeile.appendChild(neuesElement("span", "wortart", "[" + wortartDeutsch(eintrag.partOfSpeech) + "]"));
          klapp.appendChild(zeile);
        }
      }
      klapp.appendChild(neuesElement("div", "hinweis", "Quelle: en.wiktionary.org"));
      if (nummer) ergebnis.appendChild(klapp);      // ohne Eintrag (Wortgruppe) keine Erklärung

      // Wortgruppe ohne Eintrag: Einzelwörter als Knöpfe zum Nachschlagen
      if (wortgruppe && wortgruppe.einzel.length) {
        const zeile = neuesElement("div", "einzelwoerter", "Einzelwörter: ");
        for (const w of wortgruppe.einzel) {
          const k = neuesElement("button", "einzelwort", w);
          k.type = "button";
          k.addEventListener("click", () => { wortFeld.value = w; formular.requestSubmit(); });
          zeile.appendChild(k);
        }
        ergebnis.appendChild(zeile);
      }

      // Deutsche Bedeutung zuerst (das Beispiel kann den de.wiktionary-Eintrag mitbenutzen)
      const bedeutung = await deutscheBedeutungFinden(gefunden, eingabe, sprache, eintraege, wahl);
      deInhalt.textContent = "";
      // Reflexiv gemeint ("sich durchsetzen")? Dann die Bedeutungen mit "refl." nach vorne
      if (wahl && wahl.reflexiv && bedeutung.eintrag) {
        const refl = z => /^refl\.|reflexiv/i.test(z.text) ? 0 : 1;
        bedeutung.zeilen = [...bedeutung.zeilen].sort((a, b) => refl(a) - refl(b));
      }
      if (bedeutung.zeilen.length) {
        let letzteArt = null;
        bedeutung.zeilen.slice(0, 4).forEach((z, i) => {
          if (z.wortart && z.wortart !== letzteArt && bedeutung.zeilen.length > 1)
            deInhalt.appendChild(neuesElement("div", "wortart", z.wortart));
          letzteArt = z.wortart;
          const nr = bedeutung.zeilen.length > 1 ? (i + 1) + ". " : "";
          deInhalt.appendChild(neuesElement("div", "bedeutung", nr + z.text));
          if (z.zusatz) deInhalt.appendChild(neuesElement("div", "wortart", z.zusatz));
        });
        if (bedeutung.zeilen.length > 4)
          deInhalt.appendChild(neuesElement("div", "wortart", "… und " + (bedeutung.zeilen.length - 4) + " weitere"));
        deQuelle.textContent = bedeutung.quelle;
      } else {
        // Wichtig: nichts erfinden!
        deInhalt.textContent = sprache === "de" ? "Keine deutsche Bedeutung gefunden." : "Keine deutsche Übersetzung gefunden.";
      }

      // Wortart auf Deutsch (aus de.wiktionary, sonst aus en.wiktionary übersetzt)
      // (bei klarer Wortart diese, sonst die erste aus de.wiktionary bzw. en.wiktionary)
      const deArt = bedeutung.zeilen.find(z => z.wortart);
      const enArt = eintraege.find(e => e.partOfSpeech !== "Symbol");
      wortartZeile.textContent = wortgruppe ? "Wortgruppe" : wahl && wahl.filtern ? wortartDeutsch(wahl.art)
        : (deArt ? deArt.wortart : (enArt ? wortartDeutsch(enArt.partOfSpeech) : ""));

      const beispiel = await beispielFinden(gefunden, eingabe, sprache, eintraege, bedeutung.eintrag, wahl);
      bspInhalt.textContent = "";
      if (beispiel) {
        bspInhalt.appendChild(neuesElement("div", "", beispiel.satz));
        if (beispiel.deutsch) bspInhalt.appendChild(neuesElement("div", "uebersetzung", "Deutsch: " + beispiel.deutsch));
        bspQuelle.textContent = beispiel.quelle;
      } else {
        bspInhalt.textContent = wortgruppe ? "Für diese Wortgruppe habe ich keinen Beispielsatz gefunden."
                                        : "Für dieses Wort habe ich keinen Beispielsatz gefunden.";
      }
    }

    function meldungZeigen(text, istFehler) {
      ergebnis.innerHTML = "";
      ergebnis.appendChild(neuesElement("p", istFehler ? "fehler" : "", text));
    }

    // ---------------------------------------------------------------
    // Schritt 6 + 7: Auf den Knopf (oder Enter) reagieren, Fehler behandeln
    // ---------------------------------------------------------------
    formular.addEventListener("submit", async (ereignis) => {
      ereignis.preventDefault();         // Seite nicht neu laden
      const wort = wortSaeubern(wortFeld.value);   // Eingabe säubern (siehe oben)
      const sprache = spracheFeld.value;

      // Eingabe prüfen
      if (!wort || wort.length > 100 || /[\/#<>\[\]{}|]/.test(wort)) {
        meldungZeigen("Bitte ein Wort (oder eine kurze Wortgruppe) eingeben.", true);
        return;
      }

      // Ladezustand anzeigen
      knopf.disabled = true;
      knopf.textContent = "Suche …";
      meldungZeigen("Einen Moment, ich schlage nach …", false);

      try {
        const { gefunden, eintraege, hinweise, wahl, wortgruppe } = await nachschlagen(wort, sprache);
        await ergebnisZeigen(gefunden, wort, sprache, eintraege, hinweise, wahl, wortgruppe);
      } catch (e) {
        if (e instanceof WortNichtGefunden)
          meldungZeigen("Das Wort „" + wort + "“ wurde auf " + SPRACHEN[sprache] + " nicht gefunden.", true);
        else if (e instanceof KeinInternet)
          meldungZeigen("Keine Verbindung zum Wörterbuch. Bitte Internet prüfen und nochmal versuchen." +
                        (e.message ? " (" + e.message + ")" : ""), true);
        else
          meldungZeigen("Die Antwort des Wörterbuchs konnte nicht gelesen werden.", true);
      } finally {
        // Knopf wieder normal machen
        knopf.disabled = false;
        knopf.textContent = "Nachschlagen";
      }
    });

    // ---------------------------------------------------------------
    // Spracheingabe mit dem Mikrofon (Web Speech API)
    // Chrome und Safari kennen sie unter verschiedenen Namen.
    //
    // Besonderheiten auf iPhone/iPad (Safari), darum ist der Code etwas länger:
    // - Die Erkennung muss DIREKT beim Tippen starten (nicht später).
    // - Oft kommen nur "Zwischenergebnisse" und nie ein Endergebnis.
    //   Darum merken wir uns immer den letzten erkannten Text und benutzen ihn,
    //   sobald eine kurze Pause kommt oder die Erkennung endet.
    // - Manchmal endet die Erkennung nie von selbst -> wir stoppen sie selbst.
    // - Als App auf dem Home-Bildschirm geht es bei vielen iOS-Versionen gar nicht.
    // ---------------------------------------------------------------
    const Spracherkennung = window.SpeechRecognition || window.webkitSpeechRecognition;
    let erkennung = null;   // die laufende Erkennung (oder null)
    let letzterText = "";   // zuletzt erkannter Text (auch Zwischenergebnis)
    let fertig = true;      // wurde die laufende Erkennung schon ausgewertet?
    let uhren = {};         // Zeitschalter (Pause, Höchstdauer, Startkontrolle)

    // Läuft die Seite als App vom Home-Bildschirm (ohne Safari-Leiste)?
    const alsApp = window.navigator.standalone === true ||
                   window.matchMedia("(display-mode: standalone)").matches;
    const istApple = /iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent) && "ontouchend" in document;

    // Aus dem Gesprochenen höchstens 3 Wörter nehmen (z. B. "la maison").
    // Den Artikel entfernt später die Suche.
    function erstesWort(text, sprache) {
      let wort = wortSaeubern(text).split(" ").slice(0, 3).join(" ");
      wort = wortSaeubern(wort);                    // Satzzeichen weg
      // Deutsch: Groß-/Kleinschreibung behalten (Nomen wie "Haus")
      return sprache === "de" ? wort : wort.toLowerCase();
    }

    function mikroHinweisZeigen(text) {
      mikroHinweis.hidden = !text;
      mikroHinweis.textContent = text || "";
    }

    // Notlösung: Wortfeld anwählen, damit die Tastatur mit ihrem Mikrofon erscheint.
    // (iPhone öffnet die Tastatur nur, wenn das direkt beim Tippen passiert.)
    const TASTATUR_TIPP = "Tippe ins Wortfeld und dann auf das Mikrofon 🎤 unten auf der Tastatur – " +
                          "dann wird das Wort automatisch nachgeschlagen.";
    function tastaturAnbieten(grund) {
      mikroHinweisZeigen((grund ? grund + " " : "") + TASTATUR_TIPP);
      wortFeld.focus();
    }

    function uhrenStoppen() {
      for (const name in uhren) clearTimeout(uhren[name]);
      uhren = {};
    }

    function mikroZuruecksetzen() {
      uhrenStoppen();
      erkennung = null;
      mikroKnopf.classList.remove("hoert");
      mikroKnopf.textContent = "🎤";
    }

    // Die Erkennung beenden und auswerten. Wird nur EINMAL pro Versuch ausgeführt
    // (egal ob durch Pause, Höchstdauer, Fehler oder Ende).
    function abschliessen(fehlerText) {
      if (fertig) return;
      fertig = true;
      const alte = erkennung;
      mikroZuruecksetzen();
      if (alte) { try { alte.abort(); } catch (e) { /* schon beendet */ } }

      const sprache = spracheFeld.value;
      const wort = erstesWort(letzterText, sprache);
      if (wort) {
        // Etwas verstanden (auch nur als Zwischenergebnis) -> nachschlagen
        mikroHinweisZeigen("");
        wortFeld.value = wort;
        if (formular.requestSubmit) formular.requestSubmit();
        else formular.dispatchEvent(new Event("submit", { cancelable: true }));
        return;
      }
      meldungZeigen(fehlerText || "Ich habe nichts verstanden. Bitte nochmal tippen und " +
                    "deutlich ein Wort sagen.", true);
      // Hat es auf diesem Gerät noch nie geklappt? Dann die Tastatur als Ausweg zeigen.
      if (!localStorage.getItem("mikroHatGeklappt")) mikroHinweisZeigen(TASTATUR_TIPP);
    }

    // Nach jedem erkannten Stück: kurze Pause abwarten, dann fertig
    function pauseAbwarten() {
      clearTimeout(uhren.pause);
      uhren.pause = setTimeout(() => abschliessen(), 1500);
    }

    const FEHLER_MELDUNGEN = {
      "not-allowed": "Das Mikrofon ist nicht erlaubt. iPhone: Einstellungen › Safari › Mikrofon › " +
                     "„Erlauben“ – und Einstellungen › Siri bzw. Tastatur › „Diktierfunktion“ einschalten.",
      "service-not-allowed": "Die Spracherkennung ist hier nicht verfügbar. Bitte „Diktierfunktion“ bzw. Siri " +
                             "einschalten" + (alsApp ? " oder die Seite in Safari öffnen (nicht als App)." : "."),
      "no-speech": "Ich habe nichts gehört. Bitte nochmal tippen und gleich danach sprechen.",
      "audio-capture": "Kein Mikrofon gefunden (oder es wird gerade von einer anderen App benutzt).",
