      "network": "Für die Spracherkennung braucht es Internet.",
      "language-not-supported": "Diese Sprache kann die Spracherkennung hier nicht.",
    };

    if (!Spracherkennung) {
      // Browser kann es nicht -> Knopf führt direkt zur Tastatur
      mikroKnopf.addEventListener("click", () => tastaturAnbieten("Dieser Browser kann keine Spracheingabe."));
    } else {
      // Als Home-Bildschirm-App ist die Spracheingabe bei vielen iOS-Versionen kaputt
      // (der Knopf scheint zu gehen, aber es passiert nichts). Gleich einen Hinweis zeigen.
      if (alsApp && istApple && !localStorage.getItem("mikroHatGeklappt"))
        mikroHinweisZeigen("Hinweis: Als App vom Home-Bildschirm klappt das 🎤 auf iPhone/iPad oft nicht. " +
                           "Dann die Seite in Safari öffnen – oder das Mikrofon der Tastatur benutzen.");

      mikroKnopf.addEventListener("click", () => {
        // Hört schon zu? Dann beim zweiten Tippen beenden und das Gehörte benutzen.
        if (erkennung) { abschliessen(); return; }

        // Hat es hier schon einmal gar nicht funktioniert (als App)? Dann gleich die Tastatur.
        // (Gemerkt wird das nur 7 Tage – vielleicht klappt es nach einem iOS-Update.)
        if (alsApp && Date.now() - Number(localStorage.getItem("mikroGehtNicht") || 0) < 7 * 24 * 3600 * 1000) {
          tastaturAnbieten("Die Spracheingabe geht in der Home-Bildschirm-App nicht.");
          return;
        }
        if (!navigator.onLine) { meldungZeigen(FEHLER_MELDUNGEN.network, true); return; }

        const sprache = spracheFeld.value;
        letzterText = "";
        fertig = false;
        // Jedes Mal eine NEUE Erkennung (alte können auf iOS "hängen bleiben")
        erkennung = new Spracherkennung();
        erkennung.lang = ERKENNUNGS_SPRACHE[sprache];
        erkennung.continuous = true;       // nicht nach 3 s abbrechen – wir beenden selbst
        erkennung.interimResults = true;   // auch Zwischenergebnisse (iOS liefert oft nur diese)
        erkennung.maxAlternatives = 1;
        let gestartet = false;

        erkennung.onstart = () => {
          gestartet = true;
          clearTimeout(uhren.start);
          mikroKnopf.classList.add("hoert");  // Knopf wird rot
          mikroKnopf.textContent = "⏹";
          meldungZeigen("Ich höre zu … bitte ein Wort sagen. (Nochmal tippen = fertig)", false);
          mikroHinweisZeigen("");
        };

        erkennung.onresult = (ereignis) => {
          // Alle Stücke zusammensetzen (fertige und vorläufige)
          let text = "";
          for (let i = 0; i < ereignis.results.length; i++) text += ereignis.results[i][0].transcript;
          text = text.trim();
          if (!text) return;
          letzterText = text;
          localStorage.setItem("mikroHatGeklappt", "1");
          localStorage.removeItem("mikroGehtNicht");
          mikroHinweisZeigen("Erkannt: „" + text + "“");
          // Ein Endergebnis -> gleich fertig, sonst kurze Pause abwarten
          const letztes = ereignis.results[ereignis.results.length - 1];
          if (letztes.isFinal) abschliessen(); else pauseAbwarten();
        };

        erkennung.onerror = (ereignis) => {
          if (ereignis.error === "aborted") return;        // haben wir selbst ausgelöst
          if (ereignis.error === "no-speech" && letzterText) { abschliessen(); return; }
          if (alsApp && (ereignis.error === "service-not-allowed" || ereignis.error === "not-allowed"))
            localStorage.setItem("mikroGehtNicht", String(Date.now()));
          abschliessen(FEHLER_MELDUNGEN[ereignis.error] ||
                       "Die Spracherkennung hat nicht geklappt (" + ereignis.error + ").");
        };

        // Ende: das Gehörte benutzen (iOS liefert oft erst hier bzw. nur Zwischenergebnisse)
        erkennung.onend = () => abschliessen();

        // Startkontrolle: kommt nach 3 Sekunden kein "onstart", geht es hier nicht
        uhren.start = setTimeout(() => {
          if (gestartet) return;
          if (alsApp) localStorage.setItem("mikroGehtNicht", String(Date.now()));
          abschliessen("Die Spracherkennung startet nicht." +
                       (alsApp ? " Als App vom Home-Bildschirm geht sie auf iPhone/iPad oft nicht – " +
                                 "bitte die Seite in Safari öffnen." : ""));
          mikroHinweisZeigen(TASTATUR_TIPP);
        }, 3000);
        // Nichts gehört: nach 6 Sekunden ohne Ergebnis aufhören
        uhren.stille = setTimeout(() => {
          if (!letzterText) abschliessen(FEHLER_MELDUNGEN["no-speech"]);
        }, 6000);
        // Höchstdauer: nach 10 Sekunden auf jeden Fall auswerten
        uhren.max = setTimeout(() => abschliessen(), 10000);

        try {
          erkennung.start();   // direkt im Tipp-Ereignis starten (wichtig für iOS)
        } catch (e) {
          abschliessen("Die Spracherkennung konnte nicht starten.");
          mikroHinweisZeigen(TASTATUR_TIPP);
        }
      });
    }

    // ---------------------------------------------------------------
    // Diktieren mit dem Tastatur-Mikrofon: automatisch nachschlagen.
    // Beim normalen Tippen kommt jeder Buchstabe einzeln – beim Diktieren (oder
    // Einfügen) kommen mehrere Buchstaben auf einmal. Nur dann suchen wir
    // nach 1,5 Sekunden Pause automatisch.
    // ---------------------------------------------------------------
    let diktierUhr = null;
    let zuletztGesucht = "";
    wortFeld.addEventListener("input", (ereignis) => {
      clearTimeout(diktierUhr);
      const stueck = ereignis.data || "";
      const vieleZeichen = stueck.length >= 2 || ereignis.inputType === "insertFromPaste" ||
                           ereignis.inputType === "insertReplacementText";
      if (!vieleZeichen) return;
      diktierUhr = setTimeout(() => {
        const wort = wortSaeubern(wortFeld.value);
        if (!wort || wort === zuletztGesucht || knopf.disabled) return;
        zuletztGesucht = wort;
        if (formular.requestSubmit) formular.requestSubmit();
        else formular.dispatchEvent(new Event("submit", { cancelable: true }));
      }, 1500);
    });
    // Wer selbst "Nachschlagen" drückt, braucht keine automatische Suche mehr
    formular.addEventListener("submit", () => {
      clearTimeout(diktierUhr);
      zuletztGesucht = wortSaeubern(wortFeld.value);
    });

    // Letzte gewählte Sprache merken (bleibt im Browser gespeichert)
    spracheFeld.value = localStorage.getItem("sprache") || "de";
    spracheFeld.addEventListener("change", () => localStorage.setItem("sprache", spracheFeld.value));
  </script>
</body>
</html>
