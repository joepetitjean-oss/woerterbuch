<!DOCTYPE html>
<html lang="de">
<head>
  <!-- Grundeinstellungen: Zeichensatz und Anpassung an Handy-Bildschirme -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Diese Zeilen erlauben "Zum Home-Bildschirm hinzufügen" wie eine App -->
  <meta name="theme-color" content="#2b5797">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Wörterbuch">
  <title>Wörterbuch</title>

  <!-- ===================== Aussehen (CSS) ===================== -->
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
      background: #f2f4f8;
      color: #222;
      font-size: 18px;            /* große Schrift für das Handy */
    }
    header {
      background: #2b5797;
      color: white;
      padding: 16px;
      text-align: center;
    }
    header h1 { margin: 0; font-size: 1.5em; }
    main { padding: 16px; max-width: 600px; margin: 0 auto; }

    label { display: block; font-weight: bold; margin: 12px 0 6px; }
    /* Große Felder und Knopf: gut mit dem Finger zu treffen */
    select, input, button {
      width: 100%;
      font-size: 1.1em;           /* ab 16px zoomt iPhone nicht automatisch */
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #b8c0cc;
      background: white;
    }
    button {
      margin-top: 16px;
      background: #2b5797;
      color: white;
      border: none;
      font-weight: bold;
    }
    button:disabled { background: #8a9bb8; }

    /* Wortfeld und Mikrofon-Knopf nebeneinander */
    .wortzeile { display: flex; gap: 8px; }
    .wortzeile input { flex: 1; }
    #mikro {
      width: 60px;                /* groß genug für den Daumen */
      margin-top: 0;
      font-size: 1.4em;
      padding: 0;
    }
    #mikro.hoert { background: #d32f2f; }   /* rot = hört gerade zu */

    #ergebnis {
      margin-top: 20px;
      background: white;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    #ergebnis:empty { display: none; }   /* leer = unsichtbar */
    #ergebnis h2 { margin-top: 0; }
    .bedeutung { margin: 8px 0; }
    .wortart { color: #666; font-size: 0.85em; }
    .beispiel {
      margin-top: 14px;
      padding: 10px;
      background: #eef3fb;
      border-left: 4px solid #2b5797;
      border-radius: 6px;
    }
    .uebersetzung { color: #555; font-style: italic; margin-top: 4px; }
    .fehler { color: #b00020; }
    /* Abschnitt "Auf Deutsch" (gelblicher Kasten) */
    .deutsch {
      margin-top: 16px;
      padding: 10px;
      background: #fdf6e3;
      border-left: 4px solid #e0a800;
      border-radius: 6px;
    }
    .deutsch h3, .beispiel h3 { margin: 0 0 6px; font-size: 1em; }
    #ergebnis h2 { margin-bottom: 2px; }
    /* Klappbereich "Englische Erklärung anzeigen" */
    details { margin-top: 14px; font-size: 0.9em; color: #444; }
    summary { cursor: pointer; color: #2b5797; padding: 8px 0; }
    .hinweis { color: #777; font-size: 0.8em; margin-top: 14px; }
  </style>
</head>
<body>
  <header><h1>📖 Wörterbuch</h1></header>

  <main>
    <!-- Das Formular: Sprache wählen, Wort eingeben, Knopf drücken -->
    <form id="formular">
      <label for="sprache">Sprache</label>
      <select id="sprache">
        <option value="de">Deutsch</option>
        <option value="en">Englisch</option>
        <option value="es">Spanisch</option>
        <option value="fr">Französisch</option>
      </select>

      <label for="wort">Wort</label>
      <div class="wortzeile">
        <!-- autocorrect="off": iPhone soll das Wort nicht "verbessern" -->
        <input id="wort" type="text" placeholder="z. B. Haus"
               autocomplete="off" autocapitalize="none" autocorrect="off"
               spellcheck="false" enterkeyhint="search">
        <!-- Mikrofon-Knopf für die Spracheingabe -->
        <button id="mikro" type="button" aria-label="Wort sprechen" title="Wort sprechen">🎤</button>
      </div>
      <p id="mikroHinweis" class="hinweis" hidden></p>

      <button id="knopf" type="submit">Nachschlagen</button>
    </form>

    <!-- Hier erscheint das Ergebnis -->
    <div id="ergebnis" aria-live="polite"></div>
  </main>

  <!-- ===================== Programm (JavaScript) ===================== -->
  <script>
    // ---------------------------------------------------------------
    // Schritt 1: Einstellungen festlegen
    // ---------------------------------------------------------------
    const SPRACHEN = { de: "Deutsch", en: "Englisch", es: "Spanisch", fr: "Französisch" };
    const API_ADRESSE = "https://en.wiktionary.org/api/rest_v1/page/definition/";
    // Such-Schnittstelle: hilft, wenn der Akzent fehlt (z. B. "cabron" -> "cabrón").
    // origin=* ist nötig, damit der Browser die Antwort lesen darf.
    const SUCH_ADRESSE = "https://en.wiktionary.org/w/api.php?action=query&list=search" +
                         "&srprop=&srlimit=20&format=json&origin=*&srsearch=";
    // Deutsches Wiktionary: hier stehen die deutschen Übersetzungen/Bedeutungen
    const DE_ADRESSE = "https://de.wiktionary.org/w/api.php?action=query&prop=revisions" +
                       "&rvprop=content&rvslots=main&redirects=1&format=json&formatversion=2" +
                       "&origin=*&titles=";
    // Englisches Wiktionary: ganze Seiten (für die Übersetzungstabellen)
    const EN_SEITEN_ADRESSE = "https://en.wiktionary.org/w/api.php?action=query&prop=revisions" +
                              "&rvprop=content&rvslots=main&redirects=1&format=json&formatversion=2" +
                              "&origin=*&titles=";
    // Notlösung, wenn das deutsche Wiktionary nichts hat: maschinelle Übersetzung
    const MT_ADRESSE = "https://api.mymemory.translated.net/get?langpair=";
    // Sprache für die Spracherkennung (passend zur gewählten Sprache)
    const ERKENNUNGS_SPRACHE = { de: "de-DE", en: "en-US", es: "es-ES", fr: "fr-FR" };
    // Wikimedia möchte wissen, wer anfragt. Im Browser geht das mit "Api-User-Agent".
    const API_USER_AGENT = "WoerterbuchLernprojekt/1.0 (Web-App, Uebungsprojekt)";
    const MAX_BEDEUTUNGEN = 3;

    // Eigene Fehlerarten, damit wir passende Meldungen zeigen können
    class WortNichtGefunden extends Error {}
    class KeinInternet extends Error {}

    // Elemente der Seite holen, damit wir sie später ändern können
    const formular = document.getElementById("formular");
    const spracheFeld = document.getElementById("sprache");
    const wortFeld = document.getElementById("wort");
    const knopf = document.getElementById("knopf");
    const ergebnis = document.getElementById("ergebnis");
    const mikroKnopf = document.getElementById("mikro");
    const mikroHinweis = document.getElementById("mikroHinweis");

    // ---------------------------------------------------------------
    // Eingabe säubern (wichtig fürs Handy!)
    // - normalize("NFC"): "o" + Akzent-Zeichen wird zu einem Zeichen "ó"
    // - unsichtbare Zeichen (z. B. Null-Breite-Leerzeichen) entfernen
    // - schräge Apostrophe ’ (iPhone) durch normale ' ersetzen
    // - Satzzeichen und Leerzeichen am Anfang und Ende entfernen
    // ---------------------------------------------------------------
    function wortSaeubern(text) {
      return text
        .normalize("NFC")
        .replace(/\p{Cf}/gu, "")                 // unsichtbare Steuerzeichen
        .replace(/[\u2018\u2019\u02BC]/g, "'")    // ’ ‘ ʼ  ->  '
        .replace(/^[\s\p{P}]+|[\s\p{P}]+$/gu, "") // Satzzeichen am Rand
        .replace(/\s+/g, " ");                    // mehrere Leerzeichen -> eins
    }

    // Akzente entfernen und klein schreiben: "Cabrón" -> "cabron"
    function ohneAkzente(text) {
      return text.normalize("NFD").replace(/\p{M}/gu, "").toLowerCase();
    }

    // ---------------------------------------------------------------
    // Schritt 2: HTML entfernen
    // Die Antwort enthält HTML (Links, fett usw.). Wir wollen nur Text.
    // DOMParser liest das HTML, ohne es auszuführen – das ist sicher.
    // ---------------------------------------------------------------
    function htmlEntfernen(text) {
      if (!text) return "";
      const dokument = new DOMParser().parseFromString(text, "text/html");
      dokument.querySelectorAll("style, script").forEach(e => e.remove()); // CSS-Code weg
      return dokument.body.textContent.replace(/\s+/g, " ").trim();
    }

    // ---------------------------------------------------------------
    // Schritt 3: Anfrage ins Internet schicken
    // ---------------------------------------------------------------
    async function datenHolen(wort) {
      // encodeURIComponent macht das Wort "adress-tauglich" (ä -> %C3%A4)
      const adresse = API_ADRESSE + encodeURIComponent(wort);
      let antwort;
      try {
        antwort = await fetch(adresse, { headers: { "Api-User-Agent": API_USER_AGENT } });
      } catch (e) {
        // fetch scheitert ganz, wenn keine Verbindung besteht
        throw new KeinInternet();
      }
      if (antwort.status === 404) throw new WortNichtGefunden();
      if (!antwort.ok) throw new KeinInternet("Server-Fehler " + antwort.status);
      return await antwort.json();   // Schritt 4: JSON lesen
    }

    // ---------------------------------------------------------------
    // Artikel am Anfang entfernen ("la maison" -> "maison")
    // Leute tippen oft den Artikel mit. Wiktionary kennt aber nur "maison".
    // Längere Artikel zuerst, damit "de la" vor "de" geprüft wird.
    // ---------------------------------------------------------------
    const ARTIKEL = {
      fr: ["de la", "de l'", "les", "le", "la", "l'", "une", "un", "des", "du"],
      es: ["los", "las", "el", "la", "unos", "unas", "una", "un"],
      de: ["der", "die", "das", "den", "dem", "des", "einen", "einem", "einer", "eine", "ein"],
      en: ["the", "an", "a", "to"],   // "to" für Verben: "to eat" -> "eat"
    };

    function artikelEntfernen(text, sprache) {
      const klein = text.toLowerCase();
      for (const artikel of ARTIKEL[sprache]) {
        // "l'" hängt direkt am Wort ("l'eau"), die anderen haben ein Leerzeichen danach
        const mitAbstand = artikel.endsWith("'") ? artikel : artikel + " ";
        if (klein.startsWith(mitAbstand) && text.length > mitAbstand.length) {
          return text.slice(mitAbstand.length).trim();
        }
      }
      return text;   // kein Artikel gefunden (oder nur der Artikel allein eingegeben)
    }

    // ---------------------------------------------------------------
    // "Form von": Wiktionary sagt bei "maisons" nur "plural of maison".
    // Dann holen wir lieber den Grundeintrag ("maison").
    // ---------------------------------------------------------------

    // Gibt die Grundform zurück, wenn die ERSTE Bedeutung nur "Form von ..." ist
    // (sonst null). Einträge wie "Symbol" (z. B. Sprachcodes) zählen nicht mit.
    function grundformFinden(eintraege) {
      for (const eintrag of eintraege) {
        if (eintrag.partOfSpeech === "Symbol") continue;
        for (const definition of (eintrag.definitions || [])) {
          const html = definition.definition || "";
          if (!htmlEntfernen(html)) continue;                     // leere überspringen
          if (!html.includes("form-of-definition")) return null;  // echte Bedeutung
          // Den Link zur Grundform lesen: <a href="/wiki/maison#French">
          const dokument = new DOMParser().parseFromString(html, "text/html");
          const link = dokument.querySelector(".form-of-definition-link a");
          if (!link) return null;
          const ziel = (link.getAttribute("href") || "").split("/wiki/")[1] || "";
          const grundform = decodeURIComponent(ziel.split("#")[0]).replace(/_/g, " ");
          return grundform ? { grundform, beschreibung: formAufDeutsch(htmlEntfernen(html)) } : null;
        }
      }
      return null;
    }

    // Groß-/Kleinschreibung: "Haus" und "haus" sind verschiedene Seiten.
    // Darum probieren wir notfalls auch andere Schreibweisen.
    async function eintraegeSuchen(wort, sprache) {
      const gross = wort.charAt(0).toUpperCase() + wort.slice(1).toLowerCase();
      // Deutsch: Nomen werden groß geschrieben -> Großschreibung gleich mitprobieren.
      // Andere Sprachen: zuerst wie eingegeben und klein ("House" -> "house"),
      // groß nur als Notlösung (sonst wird "ate" zur Göttin "Ate").
      const varianten = sprache === "de"
        ? [...new Set([wort, gross, wort.toLowerCase()])]     // ohne doppelte
        : [...new Set([wort, wort.toLowerCase()])];
      const treffer = await variantenProbieren(varianten, sprache)
                   || (sprache !== "de" && !varianten.includes(gross)
                       ? await variantenProbieren([gross], sprache) : null);
      if (treffer) return treffer;

      // Nichts gefunden? Vielleicht fehlt ein Akzent (z. B. "cabron" statt "cabrón").
      // Wir fragen die Wiktionary-Suche nach ähnlichen Seiten und nehmen nur
      // die, die OHNE Akzente genau gleich geschrieben werden.
      const aehnliche = (await aehnlicheSuchen(wort))
        .filter(titel => !varianten.includes(titel))
        .slice(0, 4);                         // höchstens 4 weitere Anfragen
      const treffer2 = await variantenProbieren(aehnliche, sprache);
      if (treffer2) return treffer2;
      return null;
    }

    // Probiert eine Liste von Schreibweisen nacheinander aus.
    // Gibt den ersten Treffer in der gewünschten Sprache zurück (oder null).
    // Beispiel: "haus" ist nur eine Verbform von "hausen" – das Nomen "Haus"
    // ist meistens gemeint. Darum suchen wir weiter, wenn der erste Treffer
    // nur eine "Form von" ist, und nehmen ihn nur, wenn sonst nichts passt.
    async function variantenProbieren(varianten, sprache) {
      let nurForm = null;
      for (const variante of varianten) {
        try {
          const daten = await datenHolen(variante);
          // Die Antwort ist nach Sprachcodes sortiert: { de: [...], en: [...] }
          if (!daten[sprache]) continue;
          const treffer = { gefunden: variante, eintraege: daten[sprache] };
          if (grundformFinden(treffer.eintraege)) {
            if (!nurForm) nurForm = treffer;  // merken, aber weitersuchen
            continue;
          }
          return treffer;
        } catch (e) {
          if (!(e instanceof WortNichtGefunden)) throw e; // andere Fehler weitergeben
        }
      }
      return nurForm;
    }

    // Fragt die Wiktionary-Suche nach Seiten, die bis auf Akzente gleich sind.
    async function aehnlicheSuchen(wort) {
      try {
        const antwort = await fetch(SUCH_ADRESSE + encodeURIComponent(wort),
                                    { headers: { "Api-User-Agent": API_USER_AGENT } });
        if (!antwort.ok) return [];
        const daten = await antwort.json();
        const ziel = ohneAkzente(wort);
        return daten.query.search
          .map(eintrag => eintrag.title)
          .filter(titel => ohneAkzente(titel) === ziel);
      } catch (e) {
        return [];   // Suche ist nur eine Hilfe – bei Problemen einfach weglassen
      }
    }

    // ---------------------------------------------------------------
    // Die ganze Suche: Artikel weg, Wortgruppe, einzelne Wörter, Grundform
    // Gibt zurück: { gefunden, eintraege, hinweise: [...] }
    // ---------------------------------------------------------------
    // Beschreibt eine Wortform auf Deutsch ("plural of maison" -> "Mehrzahl").
    // Die englische Beschreibung zeigen wir nicht – alles soll Deutsch sein.
    function formAufDeutsch(englisch) {
      const t = englisch.toLowerCase();
      const teile = [];
      if (t.includes("feminine")) teile.push("weibliche Form");
      if (t.includes("plural")) teile.push("Mehrzahl");
      if (t.includes("past participle")) teile.push("Partizip Perfekt");
      else if (t.includes("present participle") || t.includes("gerund")) teile.push("Verlaufsform (Gerundium)");
      else if (/preterite|simple past|past tense|imperfect/.test(t)) teile.push("Vergangenheitsform");
      else if (/indicative|subjunctive|imperative|person/.test(t)) teile.push("gebeugte Verbform");
      if (/comparative/.test(t)) teile.push("Steigerungsform");
      return teile.length ? teile.join(", ") : "gebeugte Form";
    }

    async function nachschlagen(eingabe, sprache) {
      const hinweise = [];
      const gesucht = artikelEntfernen(eingabe, sprache);

      // Reihenfolge der Versuche:
      // 1. ohne Artikel ("maison"), 2. so wie eingegeben,
      // 3. bei mehreren Wörtern: jedes Wort einzeln (ohne Artikel)
      const versuche = [gesucht, eingabe];
      const woerter = gesucht.split(" ");
      if (woerter.length > 1) {
        for (const w of woerter.slice(0, 3)) {
          const ohne = artikelEntfernen(w, sprache);
          if (!ARTIKEL[sprache].includes(ohne.toLowerCase())) versuche.push(ohne);
        }
      }

      let treffer = null;
      let versuch = "";
      for (versuch of [...new Set(versuche)]) {
        treffer = await eintraegeSuchen(versuch, sprache);
        if (treffer) break;
      }
      if (!treffer) throw new WortNichtGefunden();

      // Hinweise sammeln, damit klar ist, was wirklich gesucht wurde
      if (versuch !== eingabe) {
        if (woerter.length > 1 && versuch !== gesucht)
          hinweise.push("Die Wortgruppe „" + gesucht + "“ gibt es nicht – gezeigt wird „" + versuch + "“.");
        else
          hinweise.push("Eingegeben: „" + eingabe + "“ – gesucht: „" + versuch + "“");
      }
      if (ohneAkzente(treffer.gefunden) === ohneAkzente(versuch) &&
          treffer.gefunden.toLowerCase() !== versuch.toLowerCase())
        hinweise.push("Eingegeben: „" + versuch + "“ – gefunden als „" + treffer.gefunden + "“");

      // Ist es nur eine Form (Mehrzahl, Verbform)? Dann die Grundform holen.
      const form = grundformFinden(treffer.eintraege);
      if (form) {
        try {
          const daten = await datenHolen(form.grundform);
          if (daten[sprache]) {
            hinweise.push("„" + treffer.gefunden + "“ ist eine Form von „" + form.grundform +
                          "“ (" + form.beschreibung + ")");
            return { gefunden: form.grundform, eintraege: daten[sprache], hinweise };
          }
        } catch (e) {
          if (!(e instanceof WortNichtGefunden)) throw e;
        }
      }
      return { gefunden: treffer.gefunden, eintraege: treffer.eintraege, hinweise };
    }

    // ---------------------------------------------------------------
    // Schritt 5: Ergebnis anzeigen – alles auf Deutsch
    // Wir benutzen textContent (nicht innerHTML) – so kann kein
    // fremder Code in die Seite gelangen.
    // ---------------------------------------------------------------
    function neuesElement(tag, klasse, text) {
      const e = document.createElement(tag);
      if (klasse) e.className = klasse;
      if (text) e.textContent = text;
      return e;
    }

    // Englische Wortarten (aus en.wiktionary) auf Deutsch
    const WORTARTEN = {
      "Noun": "Substantiv", "Proper noun": "Eigenname", "Verb": "Verb", "Adjective": "Adjektiv",
      "Adverb": "Adverb", "Pronoun": "Pronomen", "Preposition": "Präposition",
      "Conjunction": "Konjunktion", "Interjection": "Interjektion", "Article": "Artikel",
      "Determiner": "Begleiter", "Numeral": "Zahlwort", "Participle": "Partizip",
      "Particle": "Partikel", "Phrase": "Redewendung", "Prepositional phrase": "Wortgruppe",
      "Proverb": "Sprichwort", "Contraction": "Zusammenziehung", "Prefix": "Vorsilbe",
      "Suffix": "Nachsilbe", "Abbreviation": "Abkürzung", "Symbol": "Symbol",
    };
    function wortartDeutsch(englisch) { return WORTARTEN[englisch] || englisch || ""; }

    // Kürzel der Sprachen bei Tatoeba (Beispielsätze)
    const TATOEBA_SPRACHE = { de: "deu", en: "eng", es: "spa", fr: "fra" };
    const TATOEBA_ADRESSE = "https://api.tatoeba.org/unstable/sentences?sort=relevance&limit=10";

    // Hilfsfunktion: Adresse holen und JSON zurückgeben (oder null bei Problemen)
    async function jsonHolen(adresse, mitAgent = true) {
      try {
        const antwort = await fetch(adresse,
          mitAgent ? { headers: { "Api-User-Agent": API_USER_AGENT } } : {});
        return antwort.ok ? await antwort.json() : null;
      } catch (e) {
        return null;
      }
    }

    // ---------------------------------------------------------------
    // Wiki-Text (Quelltext von Wiktionary) lesen
    // ---------------------------------------------------------------

    // Wiki-Schreibweise in normalen Text umwandeln, z. B.
    // "das [[Haus]], {{K|ugs.}} [[Bude|die Bude]]"  ->  "das Haus, ugs.: die Bude"
    function wikiTextSaeubern(zeile) {
      let z = zeile;
      z = z.replace(/<ref[^>]*\/>/g, "");                 // Quellen-Hinweise weg
      z = z.replace(/<ref[^>]*>[\s\S]*?<\/ref>/g, "");
      // {{K|ugs.|scherzhaft}} -> "ugs., scherzhaft:"  (K = Kennzeichnung)
      z = z.replace(/\{\{K\|([^{}]*)\}\}/g, (_, inhalt) =>
        inhalt.split("|").filter(teil => !teil.includes("=")).join(", ") + ":");
      // {{Ü|es|conquistador}} -> "conquistador"  (Ü = Übersetzung)
      z = z.replace(/\{\{Ü\|[^|{}]*\|([^|{}]*)[^{}]*\}\}/g, "$1");
      // alle anderen {{Vorlagen}} entfernen (von innen nach außen)
      while (/\{\{[^{}]*\}\}/.test(z)) z = z.replace(/\{\{[^{}]*\}\}/g, "");
      // [[Ziel|Text]] -> Text   und   [[Wort]] -> Wort
      z = z.replace(/\[\[(?:[^\]|]*\|)?([^\]]*)\]\]/g, "$1");
      // "l'''eau''" = Apostroph + kursiv -> "l'eau" (sonst verschwindet der Apostroph)
      z = z.replace(/'''([^']+?)''(?!')/g, "'$1");
      z = z.replace(/'{2,}/g, "");                        // Kursiv- und Fett-Zeichen ('' und ''')
      return htmlEntfernen(z);                            // restliches HTML und &nbsp; usw.
    }

    // Schneidet aus einer Seite den Teil der richtigen Sprache heraus,
    // z. B. alles unter "== casa ({{Sprache|Spanisch}}) ==" bis zur nächsten Sprache.
    function sprachAbschnitt(wikitext, sprachName) {
      const teile = wikitext.split(/^(?===[^=])/m);   // bei jeder Sprach-Überschrift teilen
      for (const teil of teile) {
        const kopf = teil.split("\n")[0];
        const m = kopf.match(/\{\{Sprache\|([^}|]+)/);
        if (m && m[1].trim() === sprachName) return teil;
      }
      return "";
    }

    // Holt die Zeilen eines Blocks, z. B. unter {{Bedeutungen}} oder {{Beispiele}}.
    // Gibt Paare zurück: { text, unterzeilen: [...] }  (Unterzeilen beginnen mit "::")
    // Die Wortart merken wir uns aus Überschriften wie "=== {{Wortart|Substantiv|Spanisch}} ===".
    function blockLesen(abschnitt, blockName) {
      const ergebnis = [];
      let wortart = "";
      let imBlock = false;
      for (const zeile of abschnitt.split("\n")) {
        const art = zeile.match(/^===.*?\{\{Wortart\|([^|}]+)/);
        if (art) { wortart = art[1]; imBlock = false; continue; }
        if (zeile.startsWith("{{" + blockName + "}}")) { imBlock = true; continue; }
        if (!imBlock) continue;
        if (zeile.startsWith("::")) {                // Unterzeile (z. B. Übersetzung)
          if (ergebnis.length) ergebnis[ergebnis.length - 1].unterzeilen.push(wikiTextSaeubern(zeile.slice(2)));
        } else if (zeile.startsWith(":")) {
          // ":[1] das Haus" -> "das Haus"
          const roh = zeile.replace(/^:\s*(\[[^\]]*\])?/, "");
          if (/Beispiele fehlen/.test(roh)) continue;  // Platzhalter "Beispiel fehlt"
          const text = wikiTextSaeubern(roh);
          if (text) ergebnis.push({ text, wortart, unterzeilen: [] });
        } else if (!zeile.startsWith("*")) {
          imBlock = false;                           // Block ist zu Ende
        }
      }
      return ergebnis;
    }

    // Mehrere Seiten auf einmal holen (Titel mit | getrennt). Gibt { titel: wikitext } zurück.
    async function seitenHolen(basisAdresse, titelListe) {
      const daten = await jsonHolen(basisAdresse + encodeURIComponent(titelListe.join("|")));
      const abfrage = (daten && daten.query) || {};
      const seiten = {};
      for (const seite of abfrage.pages || []) {
        if (!seite.missing && seite.revisions) seiten[seite.title] = seite.revisions[0].slots.main.content;
      }
      // Umbenennungen berücksichtigen (Weiterleitung oder Normalisierung)
      for (const w of [...(abfrage.normalized || []), ...(abfrage.redirects || [])]) {
        if (seiten[w.to]) seiten[w.from] = seiten[w.to];
      }
      return seiten;
    }

    // ---------------------------------------------------------------
    // Quellen für die deutsche Bedeutung
    // ---------------------------------------------------------------

    // Quelle 1: der passende Eintrag im deutschen Wiktionary
    // Gibt { titel, bedeutungen, beispiele } zurück (oder null)
    async function deutschenEintragHolen(varianten, sprache) {
      const seiten = await seitenHolen(DE_ADRESSE, varianten);
      for (const titel of varianten) {
        if (!seiten[titel]) continue;
        const abschnitt = sprachAbschnitt(seiten[titel], SPRACHEN[sprache]);
        if (!abschnitt) continue;
        const bedeutungen = blockLesen(abschnitt, "Bedeutungen");
        if (bedeutungen.length) return { titel, bedeutungen, beispiele: blockLesen(abschnitt, "Beispiele") };
      }
      return null;
    }

    // Quelle 2: deutsche Einträge, deren Übersetzungstabelle das Wort nennt.
    // Beispiel: Die Seite "Eroberer" enthält {{Ü|es|conquistador}}.
    async function rueckwaertsSuchen(wort, sprache) {
      const adresse = "https://de.wiktionary.org/w/api.php?action=query&list=search&srprop=" +
                      "&srlimit=4&format=json&formatversion=2&origin=*&srsearch=" +
                      encodeURIComponent('insource:"Ü|' + sprache + "|" + wort + '"');
      const daten = await jsonHolen(adresse);
      const titel = ((daten && daten.query && daten.query.search) || []).map(e => e.title);
      return titel.length ? titel : null;
    }

    // Englische Stichwörter aus den Bedeutungen sammeln:
    // "conquering; winning" / "conqueror, conquistador" -> conquering, winning, conqueror, ...
    function englischeStichwoerter(eintraege) {
      const liste = [];
      let gezaehlt = 0;
      for (const eintrag of eintraege) {
        for (const definition of (eintrag.definitions || [])) {
          const html = definition.definition || "";
          if (html.includes("form-of-definition") || !htmlEntfernen(html)) continue;
          if (++gezaehlt > 4) break;                 // nur die ersten 4 Bedeutungen
          const text = htmlEntfernen(html).replace(/\([^)]*\)/g, " ");   // Klammern weg
          for (let teil of text.split(/[,;:.]/)) {
            teil = teil.trim().replace(/^(to|a|an|the)\s+/i, "").trim();
            // Wortart merken, damit wir sie später (auf Deutsch) anzeigen können
            if (teil && teil.split(" ").length <= 3 && !liste.some(x => x.wort === teil))
              liste.push({ wort: teil, art: eintrag.partOfSpeech });
          }
        }
      }
      return liste.slice(0, 8);
    }

    const ARTIKEL_DE = { m: "der", f: "die", n: "das", p: "die" };

    // Liest aus dem Wiki-Text die deutschen Wörter der ersten geprüften Tabelle
    function deutscheUebersetzungen(wikitext) {
      let sinn = "";
      let ungeprueft = false;
      for (const zeile of wikitext.split("\n")) {
        const kopf = zeile.match(/\{\{(trans-top|checktrans-top)[^|}]*\|?([^|}]*)/);
        if (kopf) {
          // Neue Tabelle beginnt; "checktrans" = noch nicht geprüft -> überspringen
          ungeprueft = kopf[1] === "checktrans-top";
          sinn = wikiTextSaeubern(kopf[2] || "");
          continue;
        }
        if (ungeprueft || !/^\*\s*German\s*:/.test(zeile)) continue;
        // {{t+|de|Möglichkeit|f}}  (auch t, tt, tt+)
        const woerter = [];
        // Das Wort darf selbst Links enthalten: {{t|de|[[glücklich]]er [[Zufall]]}}
        for (const m of zeile.matchAll(/\{\{tt?\+?\|de\|((?:\[\[[^\]]*\]\]|[^|}\[])+)(?:\|([mfnp]))?/g)) {
          const wort = wikiTextSaeubern(m[1]);
          // Artikel nur bei einzelnen Wörtern ("die Katze", aber "glücklicher Zufall")
          woerter.push(m[2] && !wort.includes(" ") ? ARTIKEL_DE[m[2]] + " " + wort : wort);
        }
        if (woerter.length) return { woerter: [...new Set(woerter)].slice(0, 4), sinn };
      }
      return null;
    }

    // Quelle 3: Übersetzungstabellen im englischen Wiktionary.
    // Wir fragen alle Stichwörter (und ihre "/translations"-Unterseiten) auf einmal ab.
    async function deutschUeberEnglisch(stichwoerter) {
      const titel = [];
      for (const s of stichwoerter) titel.push(s + "/translations", s);
      const seiten = await seitenHolen(EN_SEITEN_ADRESSE, titel);
      for (const s of stichwoerter) {
        for (const t of [s + "/translations", s]) {
          if (!seiten[t]) continue;
          // Nur den englischen Teil der Seite nehmen (bis zur nächsten Sprache)
          const englisch = (seiten[t].split(/^==English==\s*$/m)[1] || seiten[t]).split(/^==[^=]/m)[0];
          const gefunden = deutscheUebersetzungen(englisch);
          if (gefunden) return { ...gefunden, seite: s };
        }
      }
      return null;
    }

    // Quelle 4 (Notlösung): maschinelle Übersetzung (MyMemory, kostenlos, ohne Schlüssel)
    async function maschinellUebersetzen(text, sprache) {
      const daten = await jsonHolen(MT_ADRESSE + sprache + "|de&q=" + encodeURIComponent(text), false);
      if (!daten || daten.responseStatus !== 200 || daten.quotaFinished) return null;
      const ergebnis = htmlEntfernen(daten.responseData && daten.responseData.translatedText);
      // Kam der Text unverändert zurück? Dann ist es keine echte Übersetzung.
      if (!ergebnis || ergebnis.toLowerCase() === text.toLowerCase()) return null;
      return ergebnis;
    }

    // Sucht die deutsche Bedeutung in der Reihenfolge 1 -> 4.
    // Gibt { zeilen: [{text, wortart}], quelle, eintrag } zurück.
    async function deutscheBedeutungFinden(gefunden, eingabe, sprache, eintraege) {
      const gross = gefunden.charAt(0).toUpperCase() + gefunden.slice(1);
      const varianten = [...new Set([gefunden, gross, gefunden.toLowerCase(), eingabe])];

      const eintrag = await deutschenEintragHolen(varianten, sprache);
      if (eintrag) return { zeilen: eintrag.bedeutungen, eintrag,
        quelle: "Quelle: de.wiktionary.org (Eintrag „" + eintrag.titel + "“)" };
      if (sprache === "de") return { zeilen: [], quelle: "" };   // Deutsch: nichts übersetzen

      // Quelle 2 und 3 gleichzeitig fragen (spart Zeit):
      // 2 = Übersetzungstabellen im englischen Wiktionary (über die englische Bedeutung)
      // 3 = deutsche Einträge, die das Wort als Übersetzung nennen (Rückwärtssuche)
      const liste = sprache === "en" ? [{ wort: gefunden, art: "" }] : englischeStichwoerter(eintraege);
      const stichwoerter = liste.map(x => x.wort);
      const [tabelle, rueck] = await Promise.all([
        stichwoerter.length ? deutschUeberEnglisch(stichwoerter) : null,
        rueckwaertsSuchen(gefunden, sprache),
      ]);
      if (tabelle) {
        // Die Rückwärtssuche liefert oft auch verwandte Wörter ("Sitzgelegenheit").
        // Darum nur als Bestätigung: Wörter, die in beiden Quellen stehen.
        const ohneArtikel = w => w.replace(/^(der|die|das) /, "");
        const bestaetigt = (rueck || []).filter(t => tabelle.woerter.some(w => ohneArtikel(w) === t));
        // (Die englische Erklärung der Tabelle zeigen wir nicht – alles soll Deutsch sein.)
        const art = (liste.find(x => x.wort === tabelle.seite) || {}).art;
        return { zeilen: [{ text: tabelle.woerter.join(", "), wortart: art ? wortartDeutsch(art) : "" }],
          quelle: "Quelle: en.wiktionary.org – Übersetzungstabelle von „" + tabelle.seite + "“" +
                  (sprache === "en" ? "" : " (über die englische Bedeutung)") +
                  (bestaetigt.length ? "; bestätigt durch de.wiktionary („" + bestaetigt.join("“, „") + "“)" : "") };
      }
      if (rueck) return { zeilen: [{ text: rueck.join(", ") }],
        quelle: "Quelle: de.wiktionary.org – deutsche Einträge, die „" + gefunden +
                "“ als " + SPRACHEN[sprache] + "-Übersetzung nennen" };

      const mt = await maschinellUebersetzen(gefunden, sprache);
      if (mt) return { zeilen: [{ text: mt }], quelle: "Maschinelle Übersetzung (MyMemory) – kann ungenau sein" };
      return { zeilen: [], quelle: "" };
    }

    // ---------------------------------------------------------------
    // Quellen für den Beispielsatz (immer mit deutscher Übersetzung)
    // ---------------------------------------------------------------

    // Tatoeba: echte Sätze von Freiwilligen, mit deutscher Übersetzung.
    // "=wort" sucht genau diese Wortform.
    async function tatoebaBeispiel(woerter, sprache) {
      // Durchgang 1: genau diese Wortform ("=wort").
      // Durchgang 2: auch andere Formen ("bouquiner" -> "bouquine"), aber nur Sätze,
      // in denen ein Wort mit demselben Anfang vorkommt (Wort ohne den letzten Buchstaben).
      const versuche = woerter.map(w => ({ wort: w, genau: true }));
      if (!woerter[0].includes(" ") && woerter[0].length >= 5) versuche.push({ wort: woerter[0], genau: false });
      for (const { wort, genau } of versuche) {
        const suche = wort.includes(" ") ? '"' + wort + '"' : (genau ? "=" : "") + wort;
        let adresse = TATOEBA_ADRESSE + "&lang=" + TATOEBA_SPRACHE[sprache] + "&q=" + encodeURIComponent(suche);
        if (sprache !== "de") adresse += "&" + encodeURIComponent("trans:lang") + "=deu";
        const daten = await jsonHolen(adresse, false);
        let saetze = (daten && daten.data) || [];
        if (!genau) {
          const anfang = wort.slice(0, -1).toLowerCase();
          saetze = saetze.filter(s => s.text.toLowerCase().split(/[^\p{L}]+/u).some(t => t.startsWith(anfang)));
        }
        // Lieber einen richtigen Satz (mind. 3 Wörter, nicht zu lang) als "Maison !"
        const passend = saetze.find(s => s.text.split(" ").length >= 3 && s.text.length <= 120) || saetze[0];
        if (!passend) continue;
        if (sprache === "de") return { satz: passend.text, deutsch: "",
                                       quelle: "Quelle: tatoeba.org" + (genau ? "" : " (Satz mit einer anderen Form des Wortes)") };
        const uebers = (passend.translations || []).filter(t => t.lang === "deu");
        const beste = uebers.find(t => t.is_direct) || uebers[0];
        if (beste) return { satz: passend.text, deutsch: beste.text,
                            quelle: "Quelle: tatoeba.org" + (genau ? "" : " (Satz mit einer anderen Form des Wortes)") };
      }
      return null;
    }

    // Sucht einen Beispielsatz in der Reihenfolge:
    // 1. de.wiktionary (mit deutscher Übersetzung), 2. Tatoeba,
    // 3. en.wiktionary-Satz + maschinelle deutsche Übersetzung (gekennzeichnet)
    async function beispielFinden(gefunden, eingabe, sprache, eintraege, deEintrag) {
      const kurz = b => b.text.length <= 160;
      const deBeispiele = (deEintrag && deEintrag.beispiele) || [];
      if (sprache === "de") {
        // Zitate aus Zeitungen/Büchern stehen in „…“ und sind oft lang -> lieber einfache Sätze
        const b = deBeispiele.find(x => kurz(x) && !x.text.startsWith("„"));
        if (b) return { satz: b.text, deutsch: "", quelle: "Quelle: de.wiktionary.org" };
      } else {
        const b = deBeispiele.find(x => x.unterzeilen.length && kurz(x));
        if (b) return { satz: b.text, deutsch: b.unterzeilen[0], quelle: "Quelle: de.wiktionary.org" };
      }

      const formen = [...new Set([gefunden, eingabe.toLowerCase() === gefunden.toLowerCase() ? gefunden : eingabe])];
      const tatoeba = await tatoebaBeispiel(formen, sprache);
      if (tatoeba) return tatoeba;

      if (sprache === "de" && deBeispiele.length) {      // Zitate nur als Notlösung (das kürzeste)
        const b = [...deBeispiele].sort((x, y) => x.text.length - y.text.length)[0];
        return { satz: b.text, deutsch: "", quelle: "Quelle: de.wiktionary.org" };
      }

      // en.wiktionary-Beispiel (Originalsprache); die englische Übersetzung zeigen wir nicht
      for (const eintrag of eintraege) {
        for (const definition of (eintrag.definitions || [])) {
          for (const b of (definition.parsedExamples || [])) {
            const satz = htmlEntfernen(b.example);
            if (!satz) continue;
            if (sprache === "de") return { satz, deutsch: "", quelle: "Quelle: en.wiktionary.org" };
            const deutsch = await maschinellUebersetzen(satz, sprache);
            if (deutsch) return { satz, deutsch, quelle: "Satz: en.wiktionary.org – " +
                                  "deutsche Übersetzung maschinell (MyMemory), kann ungenau sein" };
          }
        }
      }
      return null;
    }

    // ---------------------------------------------------------------
    // Alles zusammen anzeigen
    // ---------------------------------------------------------------
    async function ergebnisZeigen(gefunden, eingabe, sprache, eintraege, hinweise) {
      ergebnis.innerHTML = "";   // altes Ergebnis löschen
      ergebnis.appendChild(neuesElement("h2", "", gefunden + " (" + SPRACHEN[sprache] + ")"));
      const wortartZeile = neuesElement("div", "wortart", "");
      ergebnis.appendChild(wortartZeile);
      // Hinweise, z. B. "Eingegeben: „la maison“ – gesucht: „maison“"
      for (const text of hinweise) ergebnis.appendChild(neuesElement("div", "hinweis", text));

      // Kasten 1: deutsche Bedeutung (Hauptteil)
      const deKasten = neuesElement("div", "deutsch");
      deKasten.appendChild(neuesElement("h3", "", sprache === "de" ? "Bedeutung auf Deutsch" : "Auf Deutsch"));
      const deInhalt = neuesElement("div", "", "Lädt …");
      const deQuelle = neuesElement("div", "hinweis", "");
      deKasten.append(deInhalt, deQuelle);

      // Kasten 2: Beispielsatz
      const bspKasten = neuesElement("div", "beispiel");
      bspKasten.appendChild(neuesElement("h3", "", "Beispiel"));
      const bspInhalt = neuesElement("div", "", "Lädt …");
      const bspQuelle = neuesElement("div", "hinweis", "");
      bspKasten.append(bspInhalt, bspQuelle);
      ergebnis.append(deKasten, bspKasten);

      // Klappbereich: englische Erklärung (nur bei Bedarf aufklappen)
      const klapp = document.createElement("details");
      klapp.appendChild(neuesElement("summary", "", "Englische Erklärung anzeigen"));
      let nummer = 0;
      for (const eintrag of eintraege) {
        if (eintrag.partOfSpeech === "Symbol") continue;   // Sprachcodes weglassen
        for (const definition of (eintrag.definitions || [])) {
          const text = htmlEntfernen(definition.definition);
          if (!text || ++nummer > 5) continue;
          const zeile = neuesElement("div", "bedeutung", nummer + ". " + text + " ");
          zeile.appendChild(neuesElement("span", "wortart", "[" + wortartDeutsch(eintrag.partOfSpeech) + "]"));
          klapp.appendChild(zeile);
        }
      }
      klapp.appendChild(neuesElement("div", "hinweis", "Quelle: en.wiktionary.org"));
      ergebnis.appendChild(klapp);

      // Deutsche Bedeutung zuerst (das Beispiel kann den de.wiktionary-Eintrag mitbenutzen)
      const bedeutung = await deutscheBedeutungFinden(gefunden, eingabe, sprache, eintraege);
      deInhalt.textContent = "";
      if (bedeutung.zeilen.length) {
        let letzteArt = null;
        bedeutung.zeilen.slice(0, 4).forEach((z, i) => {
          if (z.wortart && z.wortart !== letzteArt && bedeutung.zeilen.length > 1)
            deInhalt.appendChild(neuesElement("div", "wortart", z.wortart));
          letzteArt = z.wortart;
          const nr = bedeutung.zeilen.length > 1 ? (i + 1) + ". " : "";
          deInhalt.appendChild(neuesElement("div", "bedeutung", nr + z.text));
          if (z.zusatz) deInhalt.appendChild(neuesElement("div", "wortart", z.zusatz));
        });
        if (bedeutung.zeilen.length > 4)
          deInhalt.appendChild(neuesElement("div", "wortart", "… und " + (bedeutung.zeilen.length - 4) + " weitere"));
        deQuelle.textContent = bedeutung.quelle;
      } else {
        // Wichtig: nichts erfinden!
        deInhalt.textContent = sprache === "de" ? "Keine deutsche Bedeutung gefunden." : "Keine deutsche Übersetzung gefunden.";
      }

      // Wortart auf Deutsch (aus de.wiktionary, sonst aus en.wiktionary übersetzt)
      const deArt = bedeutung.zeilen.find(z => z.wortart);
      const enArt = eintraege.find(e => e.partOfSpeech !== "Symbol");
      wortartZeile.textContent = deArt ? deArt.wortart : (enArt ? wortartDeutsch(enArt.partOfSpeech) : "");

      const beispiel = await beispielFinden(gefunden, eingabe, sprache, eintraege, bedeutung.eintrag);
      bspInhalt.textContent = "";
      if (beispiel) {
        bspInhalt.appendChild(neuesElement("div", "", beispiel.satz));
        if (beispiel.deutsch) bspInhalt.appendChild(neuesElement("div", "uebersetzung", "Deutsch: " + beispiel.deutsch));
        bspQuelle.textContent = beispiel.quelle;
      } else {
        bspInhalt.textContent = "Für dieses Wort habe ich keinen Beispielsatz gefunden.";
      }
    }

    function meldungZeigen(text, istFehler) {
      ergebnis.innerHTML = "";
      ergebnis.appendChild(neuesElement("p", istFehler ? "fehler" : "", text));
    }

    // ---------------------------------------------------------------
    // Schritt 6 + 7: Auf den Knopf (oder Enter) reagieren, Fehler behandeln
    // ---------------------------------------------------------------
    formular.addEventListener("submit", async (ereignis) => {
      ereignis.preventDefault();         // Seite nicht neu laden
      const wort = wortSaeubern(wortFeld.value);   // Eingabe säubern (siehe oben)
      const sprache = spracheFeld.value;

      // Eingabe prüfen
      if (!wort || wort.length > 100 || /[\/#<>\[\]{}|]/.test(wort)) {
        meldungZeigen("Bitte ein Wort (oder eine kurze Wortgruppe) eingeben.", true);
        return;
      }

      // Ladezustand anzeigen
      knopf.disabled = true;
      knopf.textContent = "Suche …";
      meldungZeigen("Einen Moment, ich schlage nach …", false);

      try {
        const { gefunden, eintraege, hinweise } = await nachschlagen(wort, sprache);
        await ergebnisZeigen(gefunden, wort, sprache, eintraege, hinweise);
      } catch (e) {
        if (e instanceof WortNichtGefunden)
          meldungZeigen("Das Wort „" + wort + "“ wurde auf " + SPRACHEN[sprache] + " nicht gefunden.", true);
        else if (e instanceof KeinInternet)
          meldungZeigen("Keine Verbindung zum Wörterbuch. Bitte Internet prüfen und nochmal versuchen." +
                        (e.message ? " (" + e.message + ")" : ""), true);
        else
          meldungZeigen("Die Antwort des Wörterbuchs konnte nicht gelesen werden.", true);
      } finally {
        // Knopf wieder normal machen
        knopf.disabled = false;
        knopf.textContent = "Nachschlagen";
      }
    });

    // ---------------------------------------------------------------
    // Spracheingabe mit dem Mikrofon (Web Speech API)
    // Chrome und Safari kennen sie unter verschiedenen Namen.
    // ---------------------------------------------------------------
    const Spracherkennung = window.SpeechRecognition || window.webkitSpeechRecognition;
    let erkennung = null;   // die laufende Erkennung (oder null)

    // Aus dem Gesprochenen höchstens 3 Wörter nehmen (z. B. "la maison").
    // Den Artikel entfernt später die Suche.
    function erstesWort(text, sprache) {
      let wort = wortSaeubern(text).split(" ").slice(0, 3).join(" ");
      wort = wortSaeubern(wort);                    // Satzzeichen weg
      // Deutsch: Groß-/Kleinschreibung behalten (Nomen wie "Haus")
      return sprache === "de" ? wort : wort.toLowerCase();
    }

    function mikroZuruecksetzen() {
      erkennung = null;
      mikroKnopf.classList.remove("hoert");
      mikroKnopf.textContent = "🎤";
    }

    if (!Spracherkennung) {
      // Browser kann es nicht -> Knopf verstecken und Tipp zeigen
      mikroKnopf.hidden = true;
      mikroHinweis.hidden = false;
      mikroHinweis.textContent = "Tipp: Zum Sprechen das Mikrofon auf der Handy-Tastatur benutzen.";
    } else {
      mikroKnopf.addEventListener("click", () => {
        // Hört schon zu? Dann beim zweiten Tippen stoppen.
        if (erkennung) { erkennung.stop(); return; }

        const sprache = spracheFeld.value;
        erkennung = new Spracherkennung();
        erkennung.lang = ERKENNUNGS_SPRACHE[sprache];
        erkennung.interimResults = false;   // nur das Endergebnis
        erkennung.maxAlternatives = 1;

        erkennung.onstart = () => {
          mikroKnopf.classList.add("hoert");  // Knopf wird rot
          mikroKnopf.textContent = "⏹";
          meldungZeigen("Ich höre zu … bitte ein Wort sagen.", false);
        };

        erkennung.onresult = (ereignis) => {
          const gesagt = ereignis.results[0][0].transcript;
          const wort = erstesWort(gesagt, sprache);
          if (!wort) { meldungZeigen("Ich habe kein Wort verstanden.", true); return; }
          wortFeld.value = wort;
          // Suche automatisch starten (wie ein Druck auf "Nachschlagen")
          if (formular.requestSubmit) formular.requestSubmit();
          else formular.dispatchEvent(new Event("submit", { cancelable: true }));
        };

        erkennung.onerror = (ereignis) => {
          const meldungen = {
            "not-allowed": "Das Mikrofon ist nicht erlaubt. Bitte in den Einstellungen erlauben " +
                           "(iPhone: Diktierfunktion/Siri muss eingeschaltet sein).",
            "service-not-allowed": "Spracherkennung ist nicht verfügbar. Auf dem iPhone die " +
                                   "Diktierfunktion einschalten oder das Tastatur-Mikrofon benutzen.",
            "no-speech": "Ich habe nichts gehört. Bitte nochmal versuchen.",
            "audio-capture": "Kein Mikrofon gefunden.",
            "network": "Für die Spracherkennung braucht es Internet.",
          };
          if (ereignis.error !== "aborted")
            meldungZeigen(meldungen[ereignis.error] || "Spracherkennung fehlgeschlagen (" + ereignis.error + ").", true);
          mikroZuruecksetzen();
        };

        erkennung.onend = mikroZuruecksetzen;   // fertig -> Knopf wieder normal

        try {
          erkennung.start();
        } catch (e) {
          meldungZeigen("Spracherkennung konnte nicht starten.", true);
          mikroZuruecksetzen();
        }
      });
    }

    // Letzte gewählte Sprache merken (bleibt im Browser gespeichert)
    spracheFeld.value = localStorage.getItem("sprache") || "de";
    spracheFeld.addEventListener("change", () => localStorage.setItem("sprache", spracheFeld.value));
  </script>
</body>
</html>
